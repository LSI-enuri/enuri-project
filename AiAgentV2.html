<div class=&quot;doc-head&quot;>
  <span class=&quot;ver&quot;>v0.2 · 로직 &amp;amp; 정책</span>
  <h1>구매 타이밍 판정</h1>
  <div class=&quot;sub&quot;>가격 추이 위에 “지금 살 만한 가격인지”를 얹어주는 기능의 판정 규칙과 정책. 이번 판은 v0.1을 <b>더 단순하게</b> 정리했다.</div>
</div>

<div class=&quot;lead&quot;>
<b>한 줄 원칙.</b> 가격 데이터만으로 판단하고, <b>미래는 예측하지 않으며, 결론을 대신 내려주지 않는다.</b> 판정은 “지금 이 가격이 이 상품의 평소 대비 어디쯤인지”를 알려주는 <b>참고 정보</b>일 뿐, 최종 구매 결정은 사용자 몫이다.
</div>

<h2><span class=&quot;n&quot;>1</span>v0.1에서 바뀐 것</h2>
<div class=&quot;h2-sub&quot;>요점만.</div>
<ul>
  <li><b>역대 최저가(LOWEST) 상태 추가</b> — BUY보다 위. “지금이 관측 이래 제일 싸다”.</li>
  <li><b>WAIT을 사실로</b> — “기다려봐요” 권유 대신 “평소보다 비싼 편이에요”(수준 사실). 급등·오름세는 서브 문구로.</li>
  <li><b>rising을 BUY 차단 조건에서 제거</b> — 오르는 중이어도 중앙값보다 싸면 싼 것(미래 예측 안 함). rising·r7·near_low는 판정용이 아니라 <b>서브 문구 재료</b>로.</li>
  <li><b>HOLD 화면 미노출</b> — 데이터 부족 시 카드를 안 띄운다 (내부 계산만).</li>
  <li><b>관측 창 최대 12개월</b> — 24개월은 쓰지 않는다.</li>
  <li><b>유형 4→3</b> — 값이 같던 감가·안정을 일반형으로 통합.</li>
  <li><b>계절형의 ‘작년 동월 비교’ 삭제</b> — 관측 창만 길게(12개월).</li>
</ul>

<h2><span class=&quot;n&quot;>2</span>판정 스케일</h2>
<div class=&quot;h2-sub&quot;>최종 출력은 아래 상태 중 하나. 위로 갈수록 “지금 사기 좋다”는 신호가 강하다.</div>
<div class=&quot;states&quot;>
  <div class=&quot;st lowest&quot;>
    <span class=&quot;badge&quot;>LOWEST</span>
    <div class=&quot;body&quot;><div class=&quot;label&quot;>역대 최저가예요</div><div class=&quot;desc&quot;>관측 시작 이후 지금이 가장 싼 가격</div></div>
  </div>
  <div class=&quot;st buy&quot;>
    <span class=&quot;badge&quot;>BUY</span>
    <div class=&quot;body&quot;><div class=&quot;label&quot;>지금 가격이 좋은 편이에요</div><div class=&quot;desc&quot;>최저는 아니어도 평소보다 싸고 하위 구간</div></div>
  </div>
  <div class=&quot;st ok&quot;>
    <span class=&quot;badge&quot;>OK</span>
    <div class=&quot;body&quot;><div class=&quot;label&quot;>적정 가격이에요</div><div class=&quot;desc&quot;>평소 수준</div></div>
  </div>
  <div class=&quot;st wait&quot;>
    <span class=&quot;badge&quot;>WAIT</span>
    <div class=&quot;body&quot;><div class=&quot;label&quot;>평소보다 비싼 편이에요</div><div class=&quot;desc&quot;>‘기다려’라는 권유가 아니라 <b>지금 수준이 평소보다 높다는 사실</b>. 급등·오름세 같은 추세는 서브 문구로 (→ §6)</div></div>
  </div>
  <div class=&quot;st hold&quot;>
    <span class=&quot;badge&quot;>HOLD</span>
    <div class=&quot;body&quot;><div class=&quot;label&quot;>아직 판단 보류 <span class=&quot;hidden-tag&quot;>화면 미노출</span></div><div class=&quot;desc&quot;>데이터 부족. 판정 카드를 띄우지 않는다 (경고가 아니라 ‘아직 말할 게 없음’)</div></div>
  </div>
</div>
<div class=&quot;note&quot;><b>왜 HOLD를 숨기나.</b> “판단 보류”라는 라벨은 사용자에게 아무 정보도 주지 않으면서 화면만 차지한다. 데이터가 없으면 조용히 빠지는 게 낫다. 단, 계산 자체는 HOLD로 남겨둬야 “왜 이 상품엔 카드가 안 뜨지?”를 나중에 추적할 수 있다.</div>

<h2><span class=&quot;n&quot;>3</span>어떻게 판정하나</h2>
<div class=&quot;h2-sub&quot;>이 상품의 ‘평소 가격’을 구한 뒤, 위에서부터 먼저 걸리는 것이 판정이 된다.</div>

<h3>먼저 말로 풀면</h3>
<p>이 상품의 <b>평소 가격</b>부터 구한다 — 관측 창(예: 최근 90일) 안에서 가격들을 크기순으로 줄 세운 <b>가운데 값(중앙값)</b>이다. 평균이 아니라 중앙값을 쓰는 이유는, 출시 초 비정상 저가나 일시 급등 며칠에 <b>덜 휘둘리기</b> 때문이다. 그리고 세 가지를 잰다: 지금이 평소보다 <b>얼마나 싼지</b>, 관측 창에서 <b>몇 번째로 싼지</b>(하위 몇 %), 요즘 <b>오르는 중인지</b>.</p>

<h3>그다음, 위에서부터 차례로</h3>
<ol class=&quot;steps&quot;>
  <li class=&quot;hold&quot;>데이터가 최소 기간(<code>W_min</code>)도 안 쌓였으면 → <span class=&quot;r&quot;>HOLD</span> <span style=&quot;color:var(--muted);font-size:13px&quot;>(카드 미노출)</span></li>
  <li class=&quot;lowest-step&quot;>관측 이래 <b>지금이 최저</b>이면 → <span class=&quot;r rl&quot;>LOWEST</span></li>
  <li class=&quot;stop&quot;>최저는 아니어도 · 평소보다 유의미하게 싸고(<code>cheap</code>) · 하위 <code>P_buy</code>% 이내이면 → <span class=&quot;r&quot;>BUY</span></li>
  <li class=&quot;wait&quot;>(기준선이 믿을 만할 때) 평소보다 비싸면 → <span class=&quot;r&quot;>WAIT</span> <span style=&quot;color:var(--muted);font-size:13px&quot;>(“평소보다 비싼 편이에요”)</span></li>
  <li>그 외 → <span class=&quot;r&quot;>OK</span></li>
</ol>
<div class=&quot;note&quot;><b>‘오르는 중’은 판정을 막지 않는다.</b> 오르는 추세여도 지금 중앙값보다 싸면 그건 <b>싼 게 맞다</b>(우리 원칙: 미래를 예측하지 않는다). 그래서 rising을 BUY 차단 조건에서 뺐다. 대신 “최근 오르는 추세”라는 사실은 <b>서브 문구</b>로 알린다(→ §6). WAIT은 추세가 아니라 <b>지금 수준이 평소보다 비쌀 때</b>만 뜬다.</div>
<div class=&quot;note&quot;><b>핵심은 ‘평소보다’.</b> 고정된 몇 % 할인이 아니라, 그 상품 자신의 가격 분포에서 지금이 어느 위치인지를 본다. 그래서 그래프만 봐선 애매한 “이 낮음이 의미 있는 낮음인지”를 대신 짚어준다.</div>
<div class=&quot;flag&quot;><b>왜 LOWEST와 BUY를 나누나.</b> ‘최저’는 오늘이 관측 이래 제일 싸다는 <b>명백한 사실</b>이라 강하게 말할 수 있다. 하지만 최저는 아니어도 “평소보다 충분히 싼” 구간은 자주 있고, 그럴 때도 사용자에게 알릴 가치가 있다. 그래서 최저면 <b>LOWEST</b>로 사실을 딱 알리고, 최저는 아니어도 싼 구간이면 <b>BUY</b>로 폭넓게 잡는다 — 최저 여부에만 매이지 않게 하는 구조다.</div>

<h2><span class=&quot;n&quot;>4</span>판정에 쓰는 신호</h2>
<div class=&quot;h2-sub&quot;>모든 신호의 재료는 <b>상품마다 날짜순으로 쌓인 “그날의 최저가” 한 줄</b>(가격추이 그래프용 데이터)이다.</div>
<table>
<tr><th>신호</th><th>뜻</th><th>어디에 쓰나</th></tr>
<tr><td><code>base</code> 기준선</td><td>관측 창 값들의 <b>중앙값</b> = 이 상품의 평소 가격</td><td>싼지/비싼지의 기준</td></tr>
<tr><td><code>cheap</code> 유의미하게 쌈</td><td><b>중앙값(base)보다</b> <code>floor</code>% 이상 낮은가 (푼돈 하락 걸러냄)</td><td>BUY 조건</td></tr>
<tr><td><code>pct</code> 백분위</td><td>관측 창에서 현재가의 등수 (0 = 최저)</td><td>BUY 조건 (하위 <code>P_buy</code>%)</td></tr>
<tr><td><code>expensive</code> 비쌈</td><td>중앙값보다 <code>floor</code>% 이상 높은가</td><td>WAIT 조건</td></tr>
<tr><td><code>is_lowest</code> 최저 여부</td><td>현재가 = 관측 창 최저인가</td><td>LOWEST 조건</td></tr>
<tr><td><code>rising</code> 오르는 중</td><td>최근 추세선 기울기가 상승</td><td><b>서브 문구 재료</b> (판정엔 안 씀)</td></tr>
<tr><td><code>r7</code> 7일 변화율</td><td>일주일 새 급등했는가</td><td><b>서브 문구 재료</b></td></tr>
<tr><td><code>near_low</code> 최저 근접</td><td>관측 창 최저 대비 +X% 이내인가</td><td><b>서브 문구 재료</b></td></tr>
</table>
<div class=&quot;note&quot;><b>판정에 쓰는 신호와 문구에만 쓰는 신호가 나뉜다.</b> 판정(대표 문구)을 가르는 건 <b>가격 수준</b> 신호(<code>cheap</code>·<code>pct</code>·<code>expensive</code>·<code>is_lowest</code>)뿐이다. <b>추세</b> 신호(<code>rising</code>·<code>r7</code>·<code>near_low</code>)는 판정을 바꾸지 않고 <b>서브 문구 재료</b>로만 쓴다 — “싸다/비싸다”는 판정이 정하고, “오른다/급등했다/최저에 가깝다”는 맥락은 서브가 덧붙인다.</div>
<div class=&quot;note&quot;><b><code>floor</code>가 하는 일.</b> “<b>중앙값(평소 가격)보다 floor% 이상 싸야</b> BUY 후보로 인정”하는 최소 폭이다. 예를 들어 floor가 4%면, 평소 100만원짜리가 96만원 이하일 때만 “쌈”으로 본다. 이게 없으면 평소보다 겨우 몇백 원 싼 것도 “싸다”고 잡힐 수 있다 — 다들 비슷한 가격이면 그 작은 차이로도 백분위 등수가 확 올라가기 때문이다. <b>백분위(등수)와 floor(실제 절약 폭)를 둘 다 통과</b>해야 BUY라, 촘촘한 분포에서 나오는 헛BUY를 floor가 막아준다.</div>

<h2><span class=&quot;n&quot;>5</span>상품 유형 — 3개</h2>
<div class=&quot;h2-sub&quot;>파라미터가 <b>실제로 다를 때만</b> 유형을 나눈다. 성격 설명이 달라도 값이 같으면 합친다.</div>
<table>
<tr><th>유형</th><th>예시</th><th><code>W</code></th><th><code>W_min</code></th><th><code>floor</code></th><th><code>P_buy</code></th><th>왜 따로 두나</th></tr>
<tr><td><b>일반형</b></td><td>노트북·폰·생필품·건기식</td><td>90일</td><td>60일</td><td>4%</td><td>하위 30%</td><td>대부분의 상품. 변동이 완만</td></tr>
<tr><td><b>시세형</b></td><td>GPU·메모리</td><td>90일</td><td>30일</td><td>7%</td><td>하위 20%</td><td>변동이 커서 급등을 예민하게</td></tr>
<tr><td><b>계절형</b></td><td>에어컨·패딩</td><td>12개월</td><td>3개월</td><td>5%</td><td>하위 25%</td><td>성수기 상승이 정상이라 창을 길게</td></tr>
</table>
<div class=&quot;flag&quot;><b>위 값은 전부 시뮬레이션용 시작값이다.</b> 아직 검증된 값이 아니라 “변동이 작으면 낮게, 크면 높게”라는 원리로 잡은 출발점일 뿐이다. §8의 시뮬레이션(청소기·세탁기·건기식·스포츠화) 결과를 보고 <b>확정한다.</b></div>
<div class=&quot;note&quot;><b>계절형은 없애지 않고 유지한다.</b> 다만 v0.1의 ‘작년 동월 대비’ 비교는 뺐다. 안정적으로 쓰려면 2년치가 필요한데 관측 창을 12개월로 제한했고, 실무적으로도 “작년보다 싼가”까지 볼 필요는 없다고 봤다. 대신 관측 창만 길게(12개월) 줘서, 여름 에어컨이 자기 1년 분포 안에서 어디쯤인지로 판단한다. (한여름엔 “평소보다 높음”으로 나올 수 있는데, 실제로 비싼 시기라 틀린 판정은 아니다.)</div>

<h2><span class=&quot;n&quot;>6</span>문구는 어떻게 만드나</h2>
<div class=&quot;h2-sub&quot;>문장을 상태마다 미리 써두지 않는다. <b>판정 과정에서 이미 계산한 팩트</b>를 재료로 조합한다.</div>

<p>문구는 2단이다.</p>
<ul>
<li><b>대표 문구</b> = 판정 상태에서 나온다. 가격 <b>수준</b>만 말한다. (역대 최저 / 좋은 편 / 적정 / 비싼 편)</li>
<li><b>서브 문구</b> = 판정에 딸려 나온 <b>추세 팩트</b> 중 참인 것을 템플릿에 끼워 조합한다. 없으면 안 붙는다.</li>
</ul>
<div class=&quot;note&quot;><b>왜 이렇게 하나.</b> “최저인가·하위 몇 %인가·오르는 중인가”는 판정하면서 이미 다 계산했다. 이 팩트를 문구 재료로 그대로 재사용하면, 상태마다 문장을 따로 쟁여둘 필요 없이 <b>팩트→문장 매핑 하나</b>로 관리된다. 새 맥락을 넣고 싶으면 팩트와 템플릿 한 줄만 추가하면 된다.</div>

<h3>대표 문구 (상태 → 문장)</h3>
<table>
<tr><th>상태</th><th>대표 문구</th></tr>
<tr><td>LOWEST</td><td>역대 최저가예요</td></tr>
<tr><td>BUY</td><td>지금 가격이 좋은 편이에요</td></tr>
<tr><td>OK</td><td>적정 가격이에요</td></tr>
<tr><td>WAIT</td><td>평소보다 비싼 편이에요</td></tr>
</table>

<h3>서브 문구 (팩트 조각을 이어 붙인 서술형)</h3>
<p>서브는 대표 문구의 축약판이 아니라, <b>판정 근거를 사람이 읽는 문장으로 풀어주는</b> 자리다. 팩트 하나=문장 하나가 아니라, <b>참인 팩트들의 문장 조각을 순서대로 이어</b> 한 문단처럼 만든다. (마치 “왜 이 판정인지”를 짧게 설명해주는 느낌)</p>

<table>
<tr><th>팩트 (참일 때)</th><th>문장 조각</th></tr>
<tr><td><code>near_low</code> 최저 근접</td><td>최근 {W}개월 중 가장 낮았던 가격과 거의 비슷한 수준이고,</td></tr>
<tr><td><code>pct</code> 하위 구간</td><td>평소 가격과 비교해도 낮은 편에 속해요.</td></tr>
<tr><td><code>rising</code> 오르는 추세</td><td>다만 최근 며칠은 가격이 조금씩 오르고 있어요.</td></tr>
<tr><td><code>r7</code> 급등</td><td>특히 최근 일주일 새 가격이 크게 뛰었어요.</td></tr>
<tr><td>추세 안정</td><td>지금은 가격이 크게 움직이지 않고 안정적이에요.</td></tr>
</table>

<p><b>조합 규칙</b> — 참인 조각을 이 순서로 잇는다: ① 최저 근접/급등 같은 <b>가장 눈에 띄는 사실</b> → ② 분포상 위치(<code>pct</code>) → ③ 추세(안정/오름). 최대 2~3조각까지만 이어 과하지 않게.</p>

<div class=&quot;mini-case&quot; style=&quot;border-left-color:var(--buy)&quot;>
<b>예 — BUY · near_low · 안정 · 하위 15%</b><br>
대표: <b>“지금 가격이 좋은 편이에요”</b><br>
서브: “최근 3개월 중 가장 낮았던 가격과 거의 비슷한 수준이고, 평소 가격과 비교해도 낮은 편에 속해요. 지금은 가격이 크게 움직이지 않고 안정적이에요.”
</div>
<div class=&quot;mini-case&quot; style=&quot;border-left-color:var(--wait)&quot;>
<b>예 — BUY · 하위 20% · 오르는 추세</b><br>
대표: <b>“지금 가격이 좋은 편이에요”</b><br>
서브: “평소 가격과 비교하면 낮은 편이에요. 다만 최근 며칠은 가격이 조금씩 오르고 있어요.”
</div>

<div class=&quot;note&quot;><b>대표는 짧게, 서브는 풀어서.</b> 대표 문구는 한눈에 보는 결론(상태)이라 짧아야 하고, 서브는 그 결론을 <b>여러 사실로 뒷받침해 읽히게</b> 하는 역할이다. 그래서 서브가 대표보다 길고 서술적인 게 정상이다.</div>
<div class=&quot;flag&quot;><b>서브도 사실만, 판단은 없다.</b> “최근 오르고 있어요”까지는 사실이라 OK. “그러니 서두르세요 / 기다리세요”는 미래 예측·권유라 넣지 않는다. 조각들은 전부 <b>이미 계산된 팩트를 서술로 옮긴 것</b>일 뿐, 새로운 주장을 만들지 않는다.</div>
<div class=&quot;flag&quot;><b>사실은 코드가, 문장은 조각 템플릿이.</b> “최저인가·하위 몇 %인가·급등인가”는 <b>코드가 결정론으로 확정</b>하고, 서브 문구는 참인 팩트에 대응하는 <b>고정 문장 조각</b>을 순서대로 잇는다. 매번 새로 문장을 생성하지 않으므로, 서술형이어도 “가장 낮았던 가격과 비슷” 같은 사실 주장이 틀릴 여지가 없다. ({W} 같은 값만 판정 결과에서 채워 넣는다.)</div>

<h2><span class=&quot;n&quot;>7</span>임계값은 어디서 오나</h2>
<div class=&quot;h2-sub&quot;>유형은 사람이 한 번 정하면 끝. 임계값(<code>floor</code>·<code>P_buy</code>)은 지금은 수동으로 넣고, 나중에 자동 산출로 넓힐 수 있다.</div>
<table>
<tr><th></th><th>지금 (시뮬·파일럿)</th><th>나중 (확장)</th></tr>
<tr><td>정하는 법</td><td>사람이 시드값 입력</td><td>데이터가 자동 산출</td></tr>
<tr><td>근거</td><td>“변동 작으면 낮게, 크면 높게” 원리 + 시뮬 결과로 조정</td><td>백테스트 적중률</td></tr>
</table>
<div class=&quot;note&quot;><b>나중엔 이렇게 자동화할 수 있다 (방향).</b> “좋은 BUY의 정의”(예: BUY 후 일정 기간 더 안 싸지면 성공)를 하나 정해두면, 임계값을 여러 후보로 바꿔 과거 데이터에 돌려보고 <b>적중률이 목표를 지키는 가장 넓은 값</b>을 자동으로 고를 수 있다. 값을 유형별로(3개) 뽑아 같은 유형이 공유한다. — 단, 이건 데이터가 길게 쌓인 <b>확장 단계의 방향</b>이고, 지금 90일·4개 카테고리 규모에선 수동 조정으로 충분하다.</div>
<div class=&quot;note&quot;><b>왜 사람이 고정하지 않고 자동 산출을 지향하나.</b> 사람이 찍은 고정값은 편하지만 그게 맞는지 검증되지 않고, 시장 변동성이 달라지면 틀린 채로 남는다. 자동 산출은 “이 값이 몇 % 적중했다”가 숫자로 남고, 카테고리가 늘어도 사람 손을 덜 탄다.</div>

<h2><span class=&quot;n&quot;>8</span>진행 3단계 — 시뮬레이션 → 파일럿 → 확장</h2>
<div class=&quot;h2-sub&quot;>서비스에 바로 붙이지 않고, 검증부터 단계적으로.</div>

<h3>1단계 · 시뮬레이션 (지금)</h3>
<p>과거 <b>90일치 가격 RAW 데이터</b>(엑셀)를 받아 판정을 <b>오프라인으로 먼저 돌려본다.</b> 실서비스 연결 없이, 이 로직·정책이 실제로 상식적인 판정을 내는지부터 점검하는 단계다.</p>
<ul>
<li><b>대상 4개 카테고리:</b> 청소기 · 세탁기 · 건기식 · 스포츠화. (일반형 + 저가 구간을 함께 보기 위한 구성)</li>
<li><b>필요 데이터:</b> 상품별 <b>일자별 최저가 한 줄</b> — <code>상품ID, 날짜, 최저가</code>.</li>
<li><b>점검할 것:</b> 상품별 판정 결과(LOWEST/BUY/OK/WAIT)가 상식에 맞는지 · 각 상태가 얼마나 자주 뜨는지 · 노이즈 오판이 있는지.</li>
<li><b>산출물:</b> 상품별 판정 + 근거 수치 · 상태 분포 · <b>시드 파라미터(§5) 권장 조정값</b>.</li>
</ul>
<div class=&quot;note&quot;><b>이 단계의 목적은 “값 확정”이 아니라 “로직·정책이 맞는지” 확인이다.</b> 판정이 엉뚱하면 로직을, 빈도가 이상하면 시드값을 손본다. 각 판정이 어떤 조건으로 걸렸는지(급등/오름/최저/하위%/비쌈) 로그로 남겨야 무엇을 고칠지 짚을 수 있다.</div>

<h3>2단계 · 파일럿</h3>
<p>시뮬레이션에서 로직이 검증되면, <b>카테고리나 상품 수를 얼마나 넓힐지 결정</b>해 실제 서비스에 붙여본다. 가격이 바뀔 때 재계산하는 흐름을 이 단계에서 처음 넣는다.</p>

<h3>3단계 · 전체 확장</h3>
<p>파일럿이 안정되면 전 카테고리로 넓힌다. 이 시점부터 임계값 <b>자동 산출(§7)</b>로 전환하고, 대량 처리를 위한 선별·캐시를 구체화한다.</p>

<h2><span class=&quot;n&quot;>9</span>프로토타입 참고 — 그래프와 판정 기준의 정합</h2>
<div class=&quot;h2-sub&quot;>기존 가격추이 그래프와 이 판정을 함께 노출할 때 짚어둘 점.</div>
<div class=&quot;flag&quot;><b>기준 혼선 가능성.</b> 구매 타이밍 판정은 <b>중앙값(median)</b> 기준인데, 다나와·에누리의 기존 가격추이 그래프는 <b>평균가</b>를 참조선으로 제공하고 있다. 사용자가 그래프의 평균가 선과 판정을 나란히 보면 <b>“무슨 기준이지?” 하는 혼선</b>이 생길 수 있다.</div>
<p><b>대안 (택1 또는 병행)</b></p>
<ul>
<li><b>대안 1 — 판정에서 기준을 명시하지 않는다.</b> 판정 문구에 “평균/중앙값” 같은 기준 단어와 구체 숫자를 노출하지 않는다. (지금 문구는 상태·서술 중심이라 이미 대체로 부합) 그래프의 평균가와 판정이 <b>숫자로 부딪히지 않게</b> 한다.</li>
<li><b>대안 2 — 그래프에서 평균가 값을 삭제한다.</b> 추이 선(일자별 최저가로 그려짐)은 그대로 두고, 위에 얹힌 <b>평균가 참조선만 제거</b>한다. 그러면 그래프 추이 선과 판정이 <b>동일 데이터(일자별 최저가)</b>를 쓰게 되어 기준이 하나로 통일된다. “싼 편인가”의 판단은 그래프 대신 판정 배지가 담당.</li>
</ul>
<div class=&quot;note&quot;><b>참고 — 데이터 소스는 이미 같다.</b> 그래프 추이 선도, 우리 판정도 <b>일자별 최저가</b>를 쓴다. 이질적인 건 그래프에 얹힌 평균가 참조선뿐이다. 그래서 대안 2가 근본적이고, 대안 1은 그 전까지의 안전장치로 볼 수 있다.</div>

<div class=&quot;memo&quot;>
<span class=&quot;memo-tag&quot;>📌 검토 메모 · 나중에 다시 볼 것</span>
<h2 style=&quot;border-top:none;padding-top:0&quot;>왜 우리는 ‘분포 기준’인가</h2>
<div class=&quot;h2-sub&quot;>‘고정 임계 방식’(카테고리별 고정 %를 30일 평균 대비로 적용하는 방식)과 비교해, 우리 방식(상품 자신의 가격 분포로 정규화)의 이점을 정리해둔 메모. 논의 결과 요약.</div>

<details class=&quot;acc&quot;>
<summary>비교 대상 — ‘고정 임계 방식’이란</summary>
<div class=&quot;acc-body&quot;>
<p>비교 대상이 된 방식은 이렇게 판정한다. <b>30일 평균(avg30) 대비</b> 얼마나 벗어났는지를 재고, <b>카테고리별 고정 %</b>(예: 노트북 3%, 식품 7%)와 <b>가격대별 절대금액</b> 두 관문을 <b>둘 다</b> 넘으면 하락/상승으로 판정한다.</p>
<table>
<tr><th>state</th><th>조건</th></tr>
<tr><td>최저</td><td>현재가 = 30일 최저가</td></tr>
<tr><td>하락</td><td>하락률 ≥ 카테고리 % <b>AND</b> 하락액 ≥ 가격대 최소금액</td></tr>
<tr><td>상승</td><td>상승률 ≥ 카테고리 % <b>AND</b> 상승액 ≥ 가격대 최소금액</td></tr>
</table>
<p><b>우리(분포 기준) 방식</b>은 기준선이 평균이 아니라 <b>중앙값(median)</b>이고, 관문도 다르다 — 중앙값 대비 <code>floor%</code> 이상 싼지(거리)에 더해 <b>분포에서 하위 몇 %인지(순위)</b>와 <b>오르는 중인지(추세)</b>를 본다.</p>
<p>중요: <b>명백히 싼 상품(쉬운 케이스)에선 두 방식이 같은 답을 낸다.</b> 차이는 애매한 상품·특가 노이즈·대규모 확장에서만 벌어진다. 그래서 평소엔 “비슷해 보이는” 게 정상이다.</p>
</div>
</details>

<details class=&quot;acc&quot;>
<summary>이점 1 · ‘얼마나 빠졌나(거리)’가 아니라 ‘몇 등이냐(순위)’를 본다</summary>
<div class=&quot;acc-body&quot;>
<p>고정 임계 방식의 두 관문(% AND 금액)은 <b>둘 다 “평균에서 얼마나 멀어졌나”라는 거리</b>다. 우리는 거리(floor)에 더해 <b>분포상 순위(백분위)</b>를 본다. 이게 핵심 차이다.</p>
<p>노트북 두 개, 둘 다 오늘 평소보다 <b>7만원(3.5%) 쌈</b>:</p>
<div class=&quot;mini-case&quot;>
<b>A상품</b> — 가격이 촘촘함(내내 195~205만원). 7만원 싼 건 거의 최저권 → 하위 5%.<br>
<b>B상품</b> — 가격이 출렁임(160~240만원). 7만원 싼 건 흔한 일 → 하위 40%.
</div>
<p class=&quot;verdict-line&quot;><span class=&quot;b&quot;>고정 임계:</span> A·B 똑같이 “-3.5%, -7만원” → <b>둘 다 하락</b>으로 판정 (거리가 같으니까).</p>
<p class=&quot;verdict-line&quot;><span class=&quot;a&quot;>분포 기준:</span> A는 하위 5% → BUY, B는 하위 40% → OK. <b>같은 7만원도 이 상품에게 얼마나 드문 일인지로 구분.</b></p>
<p>거리만 보면 A·B가 같아 보이고, 순위를 보면 갈린다. 그래서 분포 기준은 <b>상품마다 공정하다.</b></p>
</div>
</details>

<details class=&quot;acc&quot;>
<summary>이점 2 · 기준선이 ‘평균’이 아니라 ‘중앙값’ — 특가 노이즈에 강하다</summary>
<div class=&quot;acc-body&quot;>
<p>고정 임계 방식은 <b>30일 평균(avg30)</b>을 기준선으로 쓴다. 평균은 <b>튀는 하루에 휘둘린다.</b></p>
<div class=&quot;mini-case&quot;>
30일 중 <b>딱 하루</b> 반값 이벤트(100만원→50만원)가 있었다고 하자.<br>
그 하루가 <b>평균 전체를 끌어내린다.</b> → 정상 가격인 나머지 날들이 “평균보다 비싸” 보여 <b>상승으로 잘못 잡힐</b> 수 있다.
</div>
<p><b>중앙값</b>은 값들을 줄 세운 가운데 값이라, 그 하루짜리 특가를 <b>무시</b>한다. 우리가 평균 대신 중앙값을 택한 이유가 이것 — 가격비교 데이터엔 일시 특가·오류가가 흔해서, 평균 기준선은 이런 날에 흔들린다.</p>
</div>
</details>

<details class=&quot;acc&quot;>
<summary>이점 3 · 카테고리가 늘어도 기준을 새로 안 박아도 된다</summary>
<div class=&quot;acc-body&quot;>
<p>고정 임계 방식은 카테고리마다 %를 사람이 정해야 한다 — 그 표가 11개 그룹에 3·5·7%를 붙인 게 이 노동이다. 노트북은 3%, 식품은 7%… 신규 카테고리가 생길 때마다 “얜 몇 %?”를 또 정해야 한다.</p>
<p>분포 기준은 <b>“하위 30%”라는 한 기준</b>이 노트북에선 노트북 분포로, 채소에선 채소 분포로 각각 자동 계산된다. 상품군이 수천 개로 늘어도 기준은 하나다.</p>
<p><b>파일럿 4개일 땐 잘 안 느껴지다가, 전체 확장할 때 결정적으로 벌어진다.</b></p>
</div>
</details>

<details class=&quot;acc&quot;>
<summary>이점 4 · 추세를 본다 (고정 임계엔 없음)</summary>
<div class=&quot;acc-body&quot;>
<p>우리 BUY엔 “오르는 중이면 차단”이 있다. 계속 내려가다 반등을 시작한 상품을, 고정 임계 방식은 “아직 평균보단 싸니 하락!”으로 잡을 수 있지만 우리는 <code>rising</code> 때문에 BUY를 막는다. <b>분포 + 추세를 함께</b> 본다.</p>
</div>
</details>

<details class=&quot;acc&quot;>
<summary>공정하게 — 저 방식이 우리보다 앞선 한 가지</summary>
<div class=&quot;acc-body&quot;>
<p>저 표의 <b>‘절대금액 AND’ 관문은 우리보다 앞서 있다.</b> 우리 <code>floor</code>는 “중앙값 대비 몇 %”만 있고 <b>금액 하한이 없어서</b>, 저가 상품에서 푼돈 변동을 못 거르는 빈틈이 있다. 저 표는 “% AND 금액” 두 관문으로 이 빈틈을 이미 막았다.</p>
<p>정리하면 — <b>전체적으로는 우리가 정교하고</b>(순위·중앙값·추세), <b>딱 ‘금액 하한’ 한 조각만 저 방식이 앞선다.</b> 그 조각은 필요하면 우리 floor에 흡수하면 된다(→ 아래 ‘절대 하한’ 항목).</p>
</div>
</details>

<details class=&quot;acc&quot;>
<summary>한 줄 결론</summary>
<div class=&quot;acc-body&quot;>
<p>분포 기준의 이점은 <b>“지금 더 정확하다”가 아니라 “상품마다 공정하고, 특가에 안 흔들리고, 확장해도 안 무너진다”</b>이다. 세 축으로 앞선다 — <b>순위(거리 아님) · 중앙값(평균 아님) · 추세.</b> 저 방식의 유일한 강점인 ‘금액 하한’은 우리가 흡수 가능하다.</p>
</div>
</details>

<details class=&quot;acc&quot;>
<summary>가격대별 최소 변동금액(절대 하한) — 지금 필요한가?</summary>
<div class=&quot;acc-body&quot;>
<p>결론: <b>지금 4개 카테고리엔 대체로 불필요. 단 건기식 저가 소포장만 시뮬에서 확인.</b></p>
<ul>
<li><b>세탁기·청소기</b>(수십만원~): 30만원 × 5% = 15,000원. 절대 하한이 낄 자리 없음 → 불필요.</li>
<li><b>스포츠화</b>(5~15만원): 5만원 × 5% = 2,500원. %가 충분히 큼 → 불필요.</li>
<li><b>건기식</b>: 대용량은 문제없지만, <b>1만원 이하 소포장</b>이 변수. 8,000원 × 5% = 400원 → “400원 빠졌다고 하락”이 될 수 있음(노이즈).</li>
</ul>
<p>그래서 <b>지금 넣지 않는다.</b> 대신 시뮬레이션에서 “1만원 이하 상품이 몇 개고, 푼돈 변동으로 하락/BUY가 잘못 잡히나”만 로그로 확인한다. 실제 오판이 보이면 그때 건기식 저가 구간에만 추가하고, 안 보이면 넣지 않는다. — <b>필요해질 때까지 만들지 않는다.</b></p>
</div>
</details>

  const W_min = d.monthly?3:6;              // 최소 관측(계절형 3개월, 그외 축약)
  if(N < W_min){ return {tier:'hold',cur,allLow,allHigh,base:cur,dBase:0,pct:50,r7:0,rising:false,spike:false,flat:true,nearLow:false,isLowest:false,N}; }
  const base=Math.round(median(P)/100)*100;
  const dBase=(base-cur)/base*100;                       // +면 base보다 쌈
  const win=P.slice(-Math.min(13,N)), below=win.filter(p=>p<cur).length;
  const pct=Math.max(4,Math.min(96,Math.round(below/win.length*100)));
  const r7=(cur-P[N-2])/P[N-2]*100;
  const sd=Math.sqrt(mean(P.map(x=>(x-mean(P))**2))), cv=sd/mean(P);
  const slope=(cur-P[Math.max(0,N-5)])/P[Math.max(0,N-5)]*100;
  const rising=slope>1.2, spike=r7>=Math.max(3,cv*100*0.6), flat=Math.abs(slope)<=1.2;
  const nearLow=cur<=Math.min(...P.slice(-4),allLow)*1.02;
  const isLowest = cur<=allLow;
  const cheap = dBase>=4;                                 // 중앙값보다 floor(4%) 이상 쌈
  const inBuyRank = pct<=30;                              // P_buy 하위 30%
  const expensive = dBase<=-4;                            // 중앙값보다 4% 이상 비쌈
  let tier;
  if(isLowest) tier='lowest';
  else if(cheap &amp;&amp; inBuyRank) tier='good';               // rising 여부와 무관
  else if(expensive) tier='wait';
  else tier='ok';
  return {cur,allLow,allHigh,base,dBase,pct,r7,cv,slope,rising,spike,flat,nearLow,isLowest,cheap,inBuyRank,expensive,tier,N};
}

const VERDICT={
 lowest:{cls:'lowest',emoji:'🔵',title:'역대 최저가예요'},
 good:{cls:'good',emoji:'✅',title:'지금 가격이 좋은 편이에요'},
 ok:{cls:'ok',emoji:'👍',title:'적정 가격이에요'},
 wait:{cls:'wait',emoji:'📈',title:'평소보다 비싼 편이에요'}
 /* hold는 미노출 — 카드 자체를 렌더하지 않음 */
};

/* ── 서브 문구: 참인 팩트 조각을 순서대로 이어 붙인 서술형 ── */
function subCopy(d,J){
  const W = d.monthly?12:3;                // 관측 창 개월 표기
  const frags=[];
  // ① 눈에 띄는 사실 (급등 / 최저 근접)
  if(J.spike) frags.push(`특히 최근 일주일 새 가격이 크게 뛰었어요.`);
  else if(J.nearLow &amp;&amp; J.tier!=='lowest') frags.push(`최근 ${W}개월 중 가장 낮았던 가격과 거의 비슷한 수준이고,`);
  // ② 분포상 위치
  if(J.tier==='good'||J.tier==='lowest'){
    frags.push(J.nearLow&amp;&amp;!J.spike ? `평소 가격과 비교해도 낮은 편에 속해요.` : `평소 가격과 비교하면 낮은 편이에요.`);
  } else if(J.tier==='wait'){
    frags.push(`평소 가격과 비교하면 다소 높은 편이에요.`);
  }
  // ③ 추세
  if(J.rising &amp;&amp; !J.spike) frags.push(`다만 최근 며칠은 가격이 조금씩 오르고 있어요.`);
  else if(J.flat &amp;&amp; (J.tier==='good'||J.tier==='lowest')) frags.push(`지금은 가격이 크게 움직이지 않고 안정적이에요.`);
  return frags.slice(0,3).join(' ');
}
/* 대표 문구 아래 붙는 한 줄 성격 요약(상태별 고정) */
function leadText(d,J){
  switch(J.tier){
    case 'lowest': return `지금까지 중 가장 싼 가격이에요.`;
    case 'good':   return d.stable?`행사로 평소보다 내려온 시점이에요.`:`평소보다 싼 구간이에요.`;
    case 'wait':   return `지금 수준은 평소보다 높아요.`;
    default:       return `평소와 큰 차이가 없어요.`;
  }
}
function bodyHTML(d,J){
  const sub=subCopy(d,J);
  return `${leadText(d,J)}${sub?` ${sub}`:''}`;
}

/* 판정 기준표 (v0.2 — 4개 노출 상태) */
const TIERS=[
 {k:'lowest',b:'역대 최저가예요',c:'cb-lowest',d:'오늘이 관측 이래 가장 싼 가격',cond:'현재가 = 관측 창 최저'},
 {k:'good',b:'지금 가격이 좋은 편이에요',c:'cb-green',d:'평소보다 싸고 하위 구간',cond:'중앙값보다 floor↑ 저렴 AND 하위 P_buy%'},
 {k:'ok',b:'적정 가격이에요',c:'cb-gray',d:'평소 수준',cond:'중앙값 ±floor 범위'},

let SC={},curData=[],curP;
const VBW=260,VBH=130,PADL=4,PADR=4,PADT=8,PADB=6;

function render(){
  const d=PRODUCTS[CUR]; CUR_ICON=d.icon||'📦';

  /* verdict — HOLD면 판정 카드 미노출(그래프·알림만, 안내 문구 없음) */

    const actK=J.tier;
    $('critRows').innerHTML=TIERS.map(t=>`<div class=&quot;crit-row ${t.k===actK?'active '+t.k:''}&quot;><span class=&quot;crit-badge ${t.c}&quot;>${t.b}</span><div class=&quot;crit-txt&quot;>${t.d}<span class=&quot;cond&quot;>${t.cond}</span></div>${t.k===actK?`<span class=&quot;crit-now ${t.k}&quot;>◀ 현재</span>`:''}</div>`).join('');
  }

  /* gauge */
  const gaugeSB=$('gaugeHandle').closest('.sb');
  if(J.tier==='hold'){ gaugeSB.style.display='none'; }

    $('gaugeHandle').style.left=J.pct+'%';
    const w=J.pct<=25?'평소보다 저렴한':J.pct<=60?'평소와 비슷한':J.pct<=80?'평소보다 다소 비싼':'평소보다 비싼';
    $('gaugeCap').innerHTML=`판정 기준 <b>${d.monthly?'최근 12개월':'최근 90일'}</b> 중 <b>하위 ${J.pct}%</b> — ${w} 구간이에요. <span style=&quot;color:#aaa&quot;>(위 기간 선택과 무관)</span>`; }

  /* alert */
  $('alertInput').value=fmt(Math.round(J.allLow/10000)*10000);
  $('alertPresets').innerHTML=`<button class=&quot;alert-preset&quot; onclick=&quot;setPreset('${fmt(J.allLow)}')&quot;>역대 최저가</button>`+
    [0.97,0.95].map(r=>`<button class=&quot;alert-preset&quot; onclick=&quot;setPreset('${fmt(Math.round(J.cur*r/10000)*10000)}')&quot;>${man(Math.round(J.cur*r/10000)*10000)}원</button>`).join('');

  /* period tabs — 24개월 제거, 최대 12개월 */
  const PS=[1,3,6,12];
  $('periodTabs').innerHTML=PS.map(p=>`<button class=&quot;period-tab&quot; data-p=&quot;${p}&quot; onclick=&quot;setPeriod(${p},this)&quot;>${p}개월</button>`).join('');
  curP=d.periodMax; setPeriodInit(d);

function buildTabs(){
  $('tabs').innerHTML=ORDER.map(k=>{
    const d=PRODUCTS[k];
    return `<button class=&quot;tab ${k===CUR?'on':''}&quot; onclick=&quot;switchTab('${k}')&quot;><span class=&quot;ico&quot;>${d.ico}</span>${d.tab}</button>`;
  }).join('');
}
function switchTab(k){CUR=k;closePop();render();window.scrollTo({top:0,behavior:'smooth'});}

/* ── 그래프 ── */
function sliceData(d,p){
  const N=d.prices.length, per=d.monthly?p:Math.round(p*4.33);
  const cnt=Math.min(N, p>=d.periodMax?N:Math.max(2,per));
  const arr=d.prices.slice(-cnt);
  const base=new Date(d.start[0],d.start[1],d.start[2]);
  return arr.map((p2,i)=>{const realIdx=N-cnt+i;const dt=new Date(base);
    if(d.monthly)dt.setMonth(dt.getMonth()+realIdx);else dt.setDate(dt.getDate()+realIdx*7);
    return{p:p2,date:dt};});
}
function setPeriodInit(d){
  document.querySelectorAll('.period-tab').forEach(t=>t.classList.toggle('on',+t.dataset.p===d.periodMax));
  curData=sliceData(d,d.periodMax); drawNote(d,d.periodMax); renderChart();
}
function setPeriod(p,el){const d=PRODUCTS[CUR];curP=p;document.querySelectorAll('.period-tab').forEach(t=>t.classList.remove('on'));el.classList.add('on');
  curData=sliceData(d,p);drawNote(d,p);hideTip();renderChart();}
function spanMonths(d){const N=d.prices.length;return d.monthly?N:Math.round(N/4.33);}
function drawNote(d,p){const sm=spanMonths(d);$('periodNote').textContent = p>sm ? `· 등록 이후(약 ${sm}개월) 데이터만 표시돼요` : '';}

function renderChart(){
  const d=PRODUCTS[CUR], data=curData, pr=data.map(o=>o.p);
  let lo=Math.min(...pr),hi=Math.max(...pr);const pad=(hi-lo)*0.16||10000;lo-=pad;hi+=pad;
  const iW=VBW-PADL-PADR,iH=VBH-PADT-PADB;
  const X=i=>PADL+(data.length===1?iW/2:(i/(data.length-1))*iW), Y=v=>PADT+(1-(v-lo)/(hi-lo))*iH;
  SC={data,X,Y};
  let path='';data.forEach((o,i)=>path+=(i?'L':'M')+X(i).toFixed(1)+','+Y(o.p).toFixed(1)+' ');
  const area=path+`L${X(data.length-1).toFixed(1)},${VBH-PADB} L${X(0).toFixed(1)},${VBH-PADB} Z`;
  let grid='';[0,.5,1].forEach(t=>{const y=(PADT+t*iH).toFixed(1);grid+=`<line x1=&quot;0&quot; y1=&quot;${y}&quot; x2=&quot;${VBW}&quot; y2=&quot;${y}&quot; stroke=&quot;#f2f2f6&quot;/>`;});
  /* 평균가 참조선 제거 (v0.2) — 추이 선만 */
  let mk='';const minI=pr.indexOf(Math.min(...pr));
  const J=judge(d);
  if(Math.min(...pr)===J.allLow) mk+=`<circle cx=&quot;${X(minI)}&quot; cy=&quot;${Y(pr[minI])}&quot; r=&quot;3.6&quot; fill=&quot;#fff&quot; stroke=&quot;#E5342A&quot; stroke-width=&quot;2&quot;/>`;
  const cx=X(data.length-1),cy=Y(data[data.length-1].p);
  mk+=`<circle cx=&quot;${cx}&quot; cy=&quot;${cy}&quot; r=&quot;5.5&quot; fill=&quot;#0092FF&quot; opacity=&quot;.16&quot;/><circle cx=&quot;${cx}&quot; cy=&quot;${cy}&quot; r=&quot;3.2&quot; fill=&quot;#0092FF&quot;/>`;
  $('chartSvg').innerHTML=grid+`<defs><linearGradient id=&quot;g&quot; x1=&quot;0&quot; y1=&quot;0&quot; x2=&quot;0&quot; y2=&quot;1&quot;><stop offset=&quot;0%&quot; stop-color=&quot;#0092FF&quot; stop-opacity=&quot;.16&quot;/><stop offset=&quot;100%&quot; stop-color=&quot;#0092FF&quot; stop-opacity=&quot;.01&quot;/></linearGradient></defs>`+
    `<path d=&quot;${area}&quot; fill=&quot;url(#g)&quot;/><path d=&quot;${path}&quot; fill=&quot;none&quot; stroke=&quot;#0092FF&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;/>`+mk+
    `<line id=&quot;hoverLine&quot; x1=&quot;0&quot; y1=&quot;${PADT}&quot; x2=&quot;0&quot; y2=&quot;${VBH-PADB}&quot; stroke=&quot;#0092FF&quot; stroke-width=&quot;1&quot; opacity=&quot;0&quot;/>`;
  const fmtY=n=>{const m=n/10000;return m>=100?(m/100).toFixed(2).replace(/\.?0+$/,'')+'백만':Math.round(m)+'만';};
  $('yAxis').innerHTML=[hi,(hi+lo)/2,lo].map(v=>`<span>${fmtY(v)}</span>`).join('');
  const idx=data.length<=4?data.map((_,i)=>i):[0,Math.round((data.length-1)/2),data.length-1];
  const lab=dt=>(dt.getFullYear()+'').slice(2)+'.'+(dt.getMonth()+1);
  $('xLabels').innerHTML=idx.map(i=>{const last=i===data.length-1;return `<span${last?' style=&quot;color:#0092FF;font-weight:700&quot;':''}>${last?'현재':lab(data[i].date)}</span>`;}).join('');
}
function moveTip(clientX){const r=$('chartSvg').getBoundingClientRect(),rel=(clientX-r.left)/r.width,data=SC.data;if(!data)return;
  let i=Math.max(0,Math.min(data.length-1,Math.round(rel*(data.length-1))));

  const hl=$('hoverLine');if(hl){hl.setAttribute('x1',xv);hl.setAttribute('x2',xv);hl.setAttribute('opacity','.4');}}

let tT;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),2400);}

<div class=&amp;quot;wrap&amp;quot;>
  <div class=&amp;quot;doc&amp;quot;>
    <h1>구매 타이밍 판정 — 한눈에</h1>
    <div class=&amp;quot;tagline&amp;quot;>정책서를 다 읽지 않아도 이 페이지만으로 골자·맥락·흐름·구조가 잡히도록 요약했어요.</div>

    <div class=&amp;quot;lead&amp;quot;><b>한 줄 골자.</b> 가격 추이 그래프 위에, <b>“지금 살 만한 가격인지”를 4단계로 판정</b>해 얹어주는 기능. 가격 데이터만으로 판단하고, <b>미래는 예측하지 않으며</b>, 최종 결정은 사용자 몫(참고 정보)이다.</div>

    <h2>왜 필요한가 (맥락)</h2>
    <p>그래프는 <b>흐름(선)</b>을 보여줄 뿐, “그래서 지금이 살 만한 때인가”라는 <b>결론</b>은 내주지 않는다. 이 기능은 그래프가 못 하는 세 가지를 한다.</p>
    <div class=&amp;quot;principles&amp;quot;>
      <div class=&amp;quot;pr&amp;quot;><b>신호를 종합해 결론.</b> ‘평소보다 쌈 + 하락 멈춤 + 급등 아님’을 한꺼번에 따져 BUY/기다려로 결론낸다. (싸 보여도 계속 내려가는 중이면 오히려 기다릴 때 — 사람이 놓치기 쉬운 부분)</div>
      <div class=&amp;quot;pr&amp;quot;><b>기준이 정교하다.</b> 눈대중이 아니라 그 상품 분포에서 <b>하위 몇 %</b>인지로 잰다(“대충 아래쪽”이 아니라 “하위 6%”).</div>
      <div class=&amp;quot;pr&amp;quot;><b>수고를 덜어준다.</b> 매번 그래프를 해석하는 대신 한 줄 결론으로 즉시 알려주고, 목표가 알림까지 연결한다.</div>
    </div>

    <h2>4단계 판정</h2>
    <div class=&amp;quot;states&amp;quot;>
      <div class=&amp;quot;st good&amp;quot;><span class=&amp;quot;b&amp;quot;>BUY</span><span class=&amp;quot;lb&amp;quot;>지금 가격이 좋은 편이에요</span><span class=&amp;quot;ds&amp;quot;>평소보다 저렴·저점, 하락 멈춤</span></div>
      <div class=&amp;quot;st ok&amp;quot;><span class=&amp;quot;b&amp;quot;>OK</span><span class=&amp;quot;lb&amp;quot;>적정 가격이에요</span><span class=&amp;quot;ds&amp;quot;>평소 수준</span></div>
      <div class=&amp;quot;st wait&amp;quot;><span class=&amp;quot;b&amp;quot;>WAIT</span><span class=&amp;quot;lb&amp;quot;>조금 더 기다려봐요</span><span class=&amp;quot;ds&amp;quot;>급등·오르는 중·비쌈</span></div>
      <div class=&amp;quot;st hold&amp;quot;><span class=&amp;quot;b&amp;quot;>HOLD</span><span class=&amp;quot;lb&amp;quot;>아직 판단 보류</span><span class=&amp;quot;ds&amp;quot;>데이터 부족(경고 아님)</span></div>
    </div>

    <h2>어떻게 판정하나 (흐름)</h2>
    <p>“평소 가격”(최근 창의 <b>중앙값</b>)을 구하고 → 지금이 얼마나 싼지·몇 번째로 싼지·오르는 중인지를 잰 뒤 → <b>위에서부터 먼저 걸리는 것</b>이 판정이 된다.</p>
    <ul class=&amp;quot;flow&amp;quot;>
      <li>데이터가 최소 기간 미만 → <b>보류(HOLD)</b></li>
      <li>최근 급등 / 오르는 중 → <b>기다려요(WAIT)</b></li>
      <li>평소보다 싸고 · 하위권이고 · 안 오름 → <b>좋은 편(BUY)</b></li>
      <li>평소보다 비쌈 → <b>기다려요(WAIT)</b></li>
      <li>그 외 → <b>적정(OK)</b></li>
    </ul>

    <h2>핵심 원칙</h2>
    <div class=&amp;quot;principles&amp;quot;>
      <div class=&amp;quot;pr&amp;quot;><b>상대 기준.</b> 고정 %가 아니라 그 상품 자신의 가격 분포(평소 대비 위치)로 판단.</div>
      <div class=&amp;quot;pr&amp;quot;><b>예측 안 함.</b> 과거·현재 데이터만 사용, 미래 가격은 추정하지 않음.</div>
      <div class=&amp;quot;pr&amp;quot;><b>단정 안 함.</b> 방어할 수 없으면 라벨로 단정하지 않고 HOLD.</div>
      <div class=&amp;quot;pr&amp;quot;><b>BUY는 적극적으로.</b> 폭넓게 띄우되 <b>오르는 중일 때만</b> 차단(급등 추격 방지).</div>
      <div class=&amp;quot;pr&amp;quot;><b>설명은 템플릿.</b> 문구는 매번 AI 생성이 아니라 판정 사유별 규칙 템플릿.</div>
    </div>

    <h2>단계적 도입 계획</h2>
    <p>서비스에 바로 붙이지 않고, 검증부터 단계적으로 확장한다.</p>
    <div class=&amp;quot;pipe&amp;quot;>
      <div class=&amp;quot;pstep&amp;quot;><div class=&amp;quot;n&amp;quot;>STEP 0</div><div class=&amp;quot;t&amp;quot;>시뮬레이션</div><div class=&amp;quot;d&amp;quot;>노트북 카테고리 90일 데이터로 판정·분포 검증</div></div>
      <div class=&amp;quot;pstep&amp;quot;><div class=&amp;quot;n&amp;quot;>STEP 1</div><div class=&amp;quot;t&amp;quot;>파일럿</div><div class=&amp;quot;d&amp;quot;>전체 카테고리의 대표 상품 N개 적용 및 가격변동 즉시 재계산</div></div>
      <div class=&amp;quot;pstep&amp;quot;><div class=&amp;quot;n&amp;quot;>STEP 2</div><div class=&amp;quot;t&amp;quot;>확장</div><div class=&amp;quot;d&amp;quot;>선별·티어·캐시 구체화하여 대량 처리</div></div>
    </div>
  </div>

<body>

<div class=&amp;quot;lead&amp;quot;><b>한 줄 원칙</b> — 임계값을 고정 %로 박지 않고 <b>상품 자신의 가격 분포(백분위·변동성·추세)로 정규화</b>한다. 카테고리는 소수 파라미터만 얹고 그마저 <b>데이터에서 자동 산출</b>한다. <b>방어할 수 없는 판단은 라벨로 단정하지 않는다.</b></div>

<h2>1. 판정 스케일</h2>
<p>최종 출력은 네 가지 상태 중 하나. <code>HOLD</code>는 “나쁜 가격” 경고가 아니라 스케일 밖의 판단 보류다.</p>
<table>
<tr><th>상태</th><th>라벨(UI)</th><th>reason 노출</th><th>의미</th></tr>
<tr><td><code>BUY</code></td><td>✅ 지금 가격이 좋은 편이에요</td><td>—</td><td>저점 구간</td></tr>
<tr><td><code>OK</code></td><td>👍 적정 가격이에요</td><td>—</td><td>평균 수준</td></tr>
<tr><td><code>WAIT</code></td><td>⏳ 조금 더 기다려봐요</td><td><b>조건부</b> (급등·오르는 중·비쌈)</td><td>지금은 사기 이른 편</td></tr>
<tr><td><code>HOLD</code></td><td>🕒 아직 판단 보류</td><td>데이터 부족</td><td>스케일 밖(경고 아님)</td></tr>
</table>

<h2 id=&amp;quot;s2&amp;quot;>2. 전체 흐름 (준비 → 판정 → 출력)</h2>
<p>로직은 두 단계로 나뉜다 — <b>준비 단계</b>(카테고리마다, 월 1회 배치)에서 파라미터를 만들어 저장해두고, <b>판정 단계</b>(상품마다)에서 그 값을 읽어 판정한다.</p>

<p>준비 단계가 카테고리 테이블에 파라미터를 저장하면, 아래 판정 단계는 그 값을 <b>읽기만</b> 한다. 그래서 측정·분류를 매 판정마다 다시 하지 않는다.</p>

<h2 id=&amp;quot;s3&amp;quot;>3. 판정 의사코드 <span class=&amp;quot;tag&amp;quot;>위 판정 단계 흐름도를 그대로 코드로</span></h2>
<p>아래 코드의 분기 순서가 <a class=&amp;quot;xref&amp;quot; href=&amp;quot;#s2&amp;quot;>§2 판정 흐름도</a>와 1:1로 대응한다. 기호 정의는 <a class=&amp;quot;xref&amp;quot; href=&amp;quot;#s4&amp;quot;>§4</a>, 파라미터(<code>W·floor·P_buy</code>)는 <a class=&amp;quot;xref&amp;quot; href=&amp;quot;#s5&amp;quot;>§5</a> 참고.</p>

<h3>먼저, 말로 풀면</h3>
<p>이 상품의 <b>‘평소 가격’</b>부터 구한다 — 최근 관측 창(예: 90일)의 최저가를 크기순으로 줄 세운 <b>가운데 값(중앙값)</b>이다. 그리고 세 가지를 잰다: 지금 가격이 평소보다 <b>얼마나 싼지</b>, 최근 그 기간 중 <b>몇 번째로 싼지</b>(백분위), 요즘 <b>오르는 중인지</b>(기울기).</p>
<p>그다음 <b>위에서부터 차례로</b> 따져 먼저 걸리는 것이 판정이 된다:</p>
<ol>
<li>데이터가 유형별 최소 기간(<code>W_min</code>)도 안 쌓였으면 → <b>아직 판단 보류</b></li>
<li>최근 7일 새 급등했으면 → <b>조금 더 기다려봐요</b> (오른 값 추격 방지)</li>
<li>지금 오르는 중이면 → <b>조금 더 기다려봐요</b></li>
<li>평소보다 유의미하게 싸고 · 하위권(<code>P_buy</code> 이내)이고 · 안 오르면 → <b>지금 가격이 좋은 편이에요</b></li>
<li>(믿을 만한 기준선에서) 평소보다 비싸면 → <b>조금 더 기다려봐요</b></li>
<li>그 외 → <b>적정 가격이에요</b></li>
</ol>
<p>핵심은 <b>‘평소보다’</b>다. 고정된 몇 % 할인이 아니라 그 상품 자신의 가격 분포에서 지금이 어느 위치인지를 본다. 그래서 그래프만 봐선 애매한 “이 낮음이 의미 있는 낮음인지”를 대신 짚어준다.</p>

<h3>코드로는</h3>
<pre><code>judge(product):
    type = profile(product)               # 카테고리 테이블에서 읽음 (없으면 전역 기본값)
    win  = prices(product, last=type.W)
    cur  = win.last

    # ① 데이터 충분성 → 보류(스케일 밖)
    if dataAge(product) &amp;amp;lt; type.W_min:
        return HOLD(&amp;quot;아직 판단 보류&amp;quot;)

    # 신호 (정의는 §4)
    base  = median(trusted(win))           # 평균 아닌 중앙값 + 안정화 가드
    tb    = baseline_trusted(product, win)
    gap   = base - cur
    cheap = gap &amp;amp;gt;= floor(type, win)        # 유의미 절약(노이즈 차단)
    rising= slope(win, 30d) &amp;amp;gt; +eps

    # ② 사실 판정 먼저 (기준선 신뢰 불필요)
    if r7(win) &amp;amp;gt;= max(type.spikeFloor, 2*sigma_weekly(win)):
        return WAIT(&amp;quot;최근 급등&amp;quot;)           # 7일 변화율 기준
    if rising:
        return WAIT(&amp;quot;오르는 중&amp;quot;)

    # ③ 구매: '저렴' 필수, '최저 근접'은 메시지 부스터일 뿐
    if cheap and pct(cur,win) &amp;amp;lt;= type.P_buy and not rising:
        v = BUY(&amp;quot;지금 가격이 좋은 편이에요&amp;quot;)
        if near_low(cur) and abs(slope) &amp;amp;lt;= eps:
            v.booster = &amp;quot;최근 최저가 부근에서 하락이 멈췄어요&amp;quot;
        return v

    # ④ '비쌈'은 기준선이 믿을 만할 때만 단정
    if tb and cur &amp;amp;gt; base and not cheap:
        return WAIT(&amp;quot;평소보다 비쌈&amp;quot;)

    return OK(&amp;quot;적정 가격이에요&amp;quot;)            # 그 외 (라벨 과claim 안 함)</code></pre>

<h2 id=&amp;quot;s4&amp;quot;>4. 상품별 자동 계산 신호</h2>
<p>모든 신호의 재료는 <b>상품마다 “그날의 최저가”를 날짜순으로 쌓은 한 줄</b>(가격추이 그래프용 데이터)이다. 아래 기호는 전부 이 한 줄에서 나온다.</p>
<dl>
<dt><code>W</code> — 관측 창 길이</dt>
<dd>며칠 치를 비교 대상으로 볼지. <a class=&amp;quot;xref&amp;quot; href=&amp;quot;#s5&amp;quot;>카테고리 파라미터(§5)</a>다. <code>win</code>은 “오늘부터 거꾸로 <code>W</code>일치 최저가”. 노트북은 <code>W=90</code>, 계절상품은 <code>365</code>처럼 길어진다.</dd>

<dt><code>cur</code> — 현재 최저가</dt>
<dd>그 줄의 <b>가장 최근 값</b>(= <code>win</code>의 마지막 원소). 새로 어디서 가져오는 게 아니라, PDP에 크게 뜨는 그 “현재 최저가” 그대로다.</dd>

<dt><code>base</code> — 기준선(중앙값)</dt>
<dd><code>win</code> 값을 크기순으로 줄 세웠을 때 <b>가운데 값</b>. <b>평균이 아니라 중앙값을 쓰는 이유</b>는, 평균은 극단값(출시 초기 비정상 저가나 일시 급등 며칠)에 끌려가지만 중앙값은 안 끌려 “이 상품의 평소 가격”을 더 정직하게 대표하기 때문이다. <b>계산</b>: 신뢰 구간만 골라(아래 안정화 가드) 정렬 → 가운데 값(짝수 개면 가운데 둘의 평균).</dd>

<dt><code>gap</code> = <code>base − cur</code></dt>
<dd>양수면 평소(중앙값)보다 그만큼 싸다는 뜻.</dd>

<dt id=&amp;quot;a-tb&amp;quot;><code>trusted_base</code> — 기준선 신뢰 여부 (참/거짓)</dt>
<dd>숫자가 아닌 플래그. 아래 3조건을 모두 통과해야 <code>true</code>이고, 그래야만 ‘평소보다 비쌈’을 단정한다. <b>HOLD와는 다른 층위</b> — HOLD는 “판정 자체 불가”, <code>false</code>는 “판정은 하되 *비쌈이라고 단정만* 보류(→ OK로)”.
<table style=&amp;quot;margin-top:6px&amp;quot;>
<tr><th>조건</th><th>의미</th><th>초기값(제안)</th></tr>
<tr><td>안정화 경과</td><td>DB 진입 후 충분히 지났나</td><td>데이터 ≥ 30일 + 출시 직후 7~14일 제외</td></tr>
<tr><td>판매처 충분</td><td>시장가를 대표하나</td><td>평균 판매처 수 ≥ 3곳</td></tr>
<tr><td>변동성 적정</td><td>너무 출렁여 ‘평소’가 무의미하진 않나</td><td>변동계수 cv ≤ 0.15</td></tr>
</table></dd>

<dt><code>slope</code> — 추세</dt>
<dd>최근 30일 회귀 기울기. 상승 / 안정 / 하락을 가른다.</dd>

<dt><code>pct</code> — 백분위</dt>
<dd><code>win</code> 안에서 현재가의 위치(0 = 최저). 가격대와 무관해 카테고리 간 비교가 가능하다.</dd>

<dt><code>r7</code> — 최근 7일 <b>변화율</b></dt>
<dd>이전 표의 “수익률”은 금융 용어를 잘못 빌린 것으로, 정확히는 <b>가격 변화율</b>이다. <code>r7 = (오늘 최저가 − 7일 전 최저가) / 7일 전 최저가</code>. 예: 7일 전 200만 → 오늘 220만이면 <code>+10%</code>. 양수로 크면(급등) <code>WAIT·급등</code>에 쓰인다.</dd>
</dl>
<h3>이 파라미터들이 의사코드에서 쓰이는 위치</h3>
<p><code>W_min</code>·<code>P_buy</code>는 신호를 <b>계산</b>하는 값이 아니라, 만든 신호를 <b>어디서 자를지</b> 정하는 값이라 위 정의 목록엔 없었다. 실제로는 <a class=&amp;quot;xref&amp;quot; href=&amp;quot;#s3&amp;quot;>§3 의사코드</a>의 분기 조건에 들어간다.</p>
<table>
<tr><th>기호</th><th>종류</th><th>§3 의사코드에서 쓰이는 분기</th></tr>
<tr><td><code>W</code></td><td>카테고리 파라미터</td><td><code>prices(last=W)</code> — 신호 계산의 입력(창 길이)</td></tr>
<tr><td><code>W_min</code></td><td>카테고리 파라미터</td><td>① 첫 게이트 <code>if dataAge &amp;amp;lt; W_min → HOLD</code> — 판정을 시작할지 여부</td></tr>
<tr><td><code>P_buy</code></td><td>카테고리 파라미터</td><td>③ 구매 분기 <code>if pct ≤ P_buy → BUY</code> — 백분위를 끊는 구매 기준선</td></tr>
</table>

<h2 id=&amp;quot;s5&amp;quot;>5. 카테고리 파라미터 — “정하는” 게 아니라 “재서 나오는”</h2>
<p><a class=&amp;quot;xref&amp;quot; href=&amp;quot;#s2&amp;quot;>§2 준비 단계</a>의 ①~④가 이 절의 내용이다. <b>측정이 먼저고, 유형은 측정의 결과이며, 파라미터는 유형이 정해진 다음 채워진다.</b> 따라서 아래 유형 프로파일 표는 입력이 아니라 <b>분류 후 적용할 규칙(출력 템플릿)</b>이다.</p>

<h3>준비 단계 (카테고리마다, 월 1회)</h3>
<pre><code>① 카테고리 표본을 측정       → cv·계절성·추세·표본길이
② 측정값으로 유형 분류        → &amp;quot;이건 감가형&amp;quot;
③ 유형이 정해지면 파라미터 채움
       W, W_min : 유형이 정함 (감가형이면 W=90)
       floor    : ①에서 잰 변동성으로 계산
       P_buy    : 전역 1값 (유형 무관)
④ 카테고리 테이블에 [유형 + W·W_min·floor·P_buy] 저장</code></pre>
<p><b>판정 단계(상품마다)</b>는 위에서 저장한 값을 <b>읽기만</b> 한다. 그래서 측정·분류가 매 판정마다 돌지 않아 순환이 생기지 않는다.</p>

<h3 id=&amp;quot;a-ops&amp;quot;>파라미터 산출 운영 — 표본·주기·비용 <span class=&amp;quot;tag new&amp;quot;>유지</span></h3>
<p><b>표본은 카테고리에 상품이 몇 개(N)든 무관.</b> 재는 건 통계적 성격이라 정밀도는 표본 수에만 달려 있고 모집단 N과 독립이다(5천 개든 5만 개든 잘 뽑은 수백 개면 같은 값).</p>

<h3 id=&amp;quot;a-pbuy&amp;quot;>P_buy — 유형 프로파일 위에 긋는 커트라인</h3>
<p>위 표의 <code>P_buy</code>(하위 몇 %) 값이 어디서 오는지다. 판정은 네 단계로 이뤄진다:</p>
<ol>
<li><b>기간을 정한다</b> — 얼마나 거슬러 볼지를 <code>W</code>로 (노트북=90일).</li>
<li><b>그 기간 가격을 줄 세운다</b> — 최근 <code>W</code>일 최저가를 크기순으로 정렬.</li>
<li><b>지금 가격의 등수를 매긴다</b> — “현재가 = 최근 90일 중 하위 8%”처럼 <b>백분위</b>로.</li>
<li><b>어디서 자를지 정한다</b> — “하위 <code>P_buy</code>%까지는 BUY” (+가드: 유의미하게 쌈·오르는 중 아님).</li>
</ol>
<div class=&amp;quot;callout&amp;quot;><b>앞 계산(①~③) = 줄 세우기, <code>P_buy</code>(④) = 커트라인.</b> 제각각인 절대 가격(179만·42만…)을 <b>‘하위 몇 %’라는 공통 잣대</b>로 번역하는 게 앞 계산의 일이고, <code>P_buy</code>는 그 잣대 위에 <b>선 하나</b>를 긋는 것뿐이다. 시험으로 치면 앞 계산은 <b>등수 매기기</b>, <code>P_buy</code>는 <b>“몇 등까지 장학금”</b>. 등수를 안 매기면 커트라인을 그을 좌표 자체가 없다. <b>선은 하나</b>여도 상품마다 등수가 다르니(A=하위 8%→BUY, B=하위 60%→아님) <b>상품별로 다른 판정</b>이 자동으로 나온다.</div>

<h4>P_buy도 자동 산출 대상이다 (사람은 목표만 정한다)</h4>
<p><code>P_buy</code> 값을 사람이 찍을 필요는 없다. “좋은 BUY의 정의”만 전역으로 한 번 정하면(예: <b>BUY 후 30일 내 추가 하락 없음 = 성공</b>), <code>P_buy</code>를 여러 값으로 <a class=&amp;quot;xref&amp;quot; href=&amp;quot;#s9&amp;quot;>백테스트</a>해 <b>“목표 적중률(예 80%)을 지키는 가장 넓은 %”를 자동으로 고른다</b>. <code>W·floor</code>처럼 준비 단계에서 채워지는 파라미터가 된다.</p>
<div class=&amp;quot;callout&amp;quot;><b>백테스트는 카테고리마다가 아니라 ‘유형마다’ 돌린다.</b> 파라미터는 4개 유형으로 묶여 있으므로, 유형별 대표 표본에 <b>총 4번</b>만 백테스트해 값을 뽑고 <b>같은 유형의 카테고리들이 공유</b>한다(감가형 노트북·폰·모니터가 같은 값). 노트북 35% vs GPU 15%가 다른 건 <b>유형이 달라서</b>지 카테고리라서가 아니다. <b>전 카테고리 개별 백테스트는 하지 않는다.</b></div>
<p><b>유형으로 묶어도 되는 이유</b> — <code>P_buy</code>가 절대가가 아닌 <b>상대 기준(하위 %)</b>이라, 앞의 백분위 계산이 상품군마다 다른 감가 속도를 이미 흡수한다. 감가가 빠른 폰은 자기 분포 안에서, 느린 노트북은 자기 분포 안에서 각각 “하위 30%”가 매겨지므로 같은 커트라인이 상품군에 맞게 작동한다. <b>다만</b> “하위 %가 실제 이득으로 이어지는 신뢰도”가 유독 다른 소수 상품군은 백테스트 적중률로 걸러 <b>그 군만 개별 값으로 덮어쓴다(override)</b>. 즉 <b>유형 공유가 기본, 개별은 예외</b>.</p>
<table>
<tr><th>구분</th><th>정하는 것</th><th>누가·언제</th></tr>
<tr><td>목표(정책 노브)</td><td>목표 적중률 · 허용 BUY 비중 범위</td><td>사람 · 전역 1회</td></tr>
<tr><td><code>P_buy</code> 값</td><td>목표를 만족하는 하위 %</td><td>유형별 백테스트 자동(분기 배치) · 같은 유형 공유</td></tr>
<tr><td>이탈 상품군</td><td>유형값이 안 맞는 소수만 개별 %</td><td>백테스트 적중률로 감지 → override</td></tr>
</table>
<div class=&amp;quot;callout&amp;quot;><b>전제 — 백테스트할 이력.</b> 자동 산출은 “<code>P_buy</code>를 바꿔가며 적중률을 잰다”는 백테스트가 돌아야 가능하고, 그러려면 판정 시점 <b>이후의 미래 데이터</b>가 필요하다(6개월~1년). 그래서 <b>초기엔 수동 시드값(적극적 스탠스: 하위 25~35%)으로 시작</b>하고, 파일럿에서 판정 로그가 몇 달 쌓이면 <b>유형별 자동 산출로 전환</b>한다. (90일 시뮬레이션에선 미래 구간이 짧아 자동 산출은 아직, 수동으로 몇 개 값만 비교해 감을 잡는다.)</div>

<h2>6. 구매(BUY) 신호 설계 — 적극적으로, 단 과트리거는 방지</h2>
<p><b>스탠스: BUY를 폭넓게 띄운다.</b> 다만 제약 없이 “평균보다 싸거나 <b>또는</b> 최저가에 근접” 둘 중 하나로 띄우면, 가격이 계속 내려가는 상품(노트북 등)은 매일 신저가를 깨 “최저가 근접”이 거의 매일 참 → 매일 ‘살 만한 가격’이 떠 신뢰가 무너진다. 그래서 <b>딱 하나의 가드</b>만 둔다.</p>
<p>BUY = <code>저렴(평균↓)</code> 그리고 <code>하위 P_buy</code> 그리고 <code>상승 아님</code>. 여기서 <code>상승 아님</code>은 <b>가격이 오르는 중일 때만</b> BUY를 막는다는 뜻이다(📉 내려가는 중·➡️ 평탄은 모두 허용, 📈 오르는 중만 차단). 오른 가격을 뒤늦게 사게 되는 것만 피하는, 느슨한 조건이라 싼 구간에선 BUY가 자주 뜬다. “최저가 근접”은 트리거가 아니라 메시지를 강화하는 보조 신호로만 쓴다.</p>
<div class=&amp;quot;callout&amp;quot;><b>BUY를 더 자주 띄우기 — 레버와 파급.</b> <b>① P_buy 상향(주 레버)</b>: 하위 %를 넓히면 BUY 빈도↑. 파급은 백테스트 적중률 재보정뿐이라 가장 안전. <b>② ‘상승 아님’ 완화</b>: 이미 느슨하나 더 풀면 감가형이 매일 뜨는 문제 재발 → <b>감가형만 유지</b>. <b>③ floor(유의미 절약) 하향</b>: ‘별로 안 싼데 뜸’ 위험 → <b>유지</b>. 결론: 넓히는 건 ①로, ②·③은 그대로 둔다.</div>

<h2 id=&amp;quot;s7&amp;quot;>7. 상태별 화면 표기 규칙 (배지·라벨·이유·게이지)</h2>
<p>판정 결과를 UI에서 어떻게 보여줄지의 매핑이다.</p>
<table>
<tr><th>상태</th><th>배지·색</th><th>라벨</th><th>reason</th><th>저렴↔비쌈 게이지</th></tr>
<tr><td><code>BUY</code></td><td>✅ 초록</td><td>지금 가격이 좋은 편이에요</td><td>— (+최저근접 부스터)</td><td>노출</td></tr>

</table>
<h3>판정 설명 문구는 규칙 기반 템플릿으로 생성</h3>
<p>배지 아래 1~2줄 설명은 <b>매번 AI가 생성하지 않고, 판정 유형별 템플릿</b>에 수치를 끼워 만든다. 매 가격 변동마다 LLM을 태우면 “판정은 가벼운 산수”라는 <a class=&amp;quot;xref&amp;quot; href=&amp;quot;#s8&amp;quot;>§8</a> 전제가 깨지고, 오래 다듬은 워딩 통제(“사라” 회피 등)를 벗어날 위험이 있어서다. “AI 분석”의 핵심 가치는 <b>판정(배지) 자체</b>이며, 설명은 그 근거를 거드는 보조다.</p>
<p><b>“모든 상황”이 아니라 “판정이 근거로 삼는 사유”만 커버하면 된다.</b> 상황 조합은 무한하지만, 우리 판정이 보는 신호는 §3 분기로 한정돼 있어 <b>사유 = 로직 분기</b>다. 그래서 분기 수만큼만 템플릿을 두면 낼 수 있는 사유는 모두 커버된다.</p>

<tr><th>판정</th><th>대표 사유(템플릿 분기)</th></tr>

<tr><td><code>WAIT</code></td><td>최근 급등 · 오르는 중 · 평소보다 비쌈</td></tr>
<tr><td><code>OK</code></td><td>평소 수준</td></tr>
<tr><td><code>HOLD</code></td><td>데이터 부족</td></tr>
</table>
<p><b>구멍은 두 규칙으로 흡수한다.</b> ①여러 사유가 동시에 맞으면 <b>판정 우선순위상 가장 중요한 사유 하나만</b> 문장으로 낸다. ②어느 특수 사유에도 안 맞으면 <b>판정 유형의 기본 문장</b>으로 떨어진다(예: OK → “평소와 큰 차이가 없어요”). 따라서 “문구가 안 나오는 경우”는 없다 — 특수 문장이 아니면 기본 문장이 항상 나온다.</p>

<h2 id=&amp;quot;s8&amp;quot;>8. 계산 비용 — 상품 판정 실행 <span class=&amp;quot;tag&amp;quot;>주로 확장 단계</span></h2>
<div class=&amp;quot;callout&amp;quot;><b>한 문장 원칙.</b> 수만 개 상품을 매 순간 다 계산하면 서버가 못 버티니, <b>계산할 가치가 있는 것만 · 가격이 바뀔 때만</b> 계산한다.</div>
<p>판정 1건은 “가격 한 줄에서 중앙값·백분위·기울기 뽑기”라 가벼운 연산이다. 문제는 <b>대상 수 × 재계산 빈도</b>가 커질 때뿐이다.</p>
<p><b>⚠ 아래 ‘누구를·언제’ 기준은 수만 개로 확장할 때의 설계다. 파일럿에는 적용하지 않으며, 단계적 확장 시 다룬다(<a class=&amp;quot;xref&amp;quot; href=&amp;quot;#s10&amp;quot;>§10</a>).</b></p>
<ul>
<li><b>누구를 계산하나</b> — 팔릴 만한 상품만(조회·검색 많고, 알림 걸려 있고, 잘 팔리는 것 우선). 판매처 하나뿐·단종·정가 고정은 제외.</li>
<li><b>언제 다시 계산하나</b> — 판정은 가격이 바뀔 때만 달라지므로 <b>가격 변동 이벤트가 뜰 때만</b> 재계산하고, 나머지 시간엔 저장값을 보여준다.</li>
</ul>
<div class=&amp;quot;callout&amp;quot;><b>파일럿(≈100개)에는 위 장치가 필요 없다.</b> 100개 고정이면 가격이 바뀔 때마다 재계산해도 이미 도는 가격 수집에 가벼운 산수 한 줄을 얹는 수준이라 부담이 없다. 선별·티어·캐시는 전부 <b>확장 단계</b>의 과제다.</div>

<h2 id=&amp;quot;s9&amp;quot;>9. 검증(백테스트)</h2>
<ul>
<li>유형별 샘플 N개 매일 판정 로그 → <code>t+30/60일</code> 실제 최저가 대조.</li>
<li>지표: BUY 적중(이후 추가 하락 없음) · WAIT 적중(이후 하락) · <b>판정 분포(BUY 비중이 목표대로인지)</b> · HOLD 해제 후 안정성.</li>
<li><code>P_buy·floor·eps·σ배수</code> 그리드서치 보정.</li>
</ul>

<h2 id=&amp;quot;s10&amp;quot;>10. 파일럿 &amp;amp;amp; 단계적 확장 <span class=&amp;quot;tag new&amp;quot;>신규</span></h2>
<p>대상은 <b>모델 상품(가격추이가 저장되는 상품군)</b>으로 한정한다. 그 안에서도 수만 개라, 복잡한 선별·lazy·티어는 다음 단계로 미루되 <b>가격 변동 재계산만은 파일럿부터 넣어</b> 단순하게 시작한다.</p>
<h3 class=&amp;quot;stage&amp;quot;><span class=&amp;quot;step&amp;quot;>전</span>파일럿 전 — 오프라인 시뮬레이션</h3>
<p>실서비스에 붙이기 전에, 과거 가격 데이터를 받아 판정을 <b>먼저 돌려본다</b>. 판정이 상식에 맞는지, BUY가 얼마나 자주 뜨는지(적극적 스탠스의 실제 빈도)를 눈으로 확인하고 <code>P_buy·floor</code>를 실데이터로 조율하기 위함이다.</p>
<p><b>필요한 데이터</b> — 상품별 <b>일자별 최저가 한 줄</b>이면 된다. (1차 대상: <b>노트북 카테고리(감가형)</b>, 90일 이상)</p>
<table>
<tr><th>컬럼</th><th>필수?</th><th>용도</th></tr>
<tr><td><code>상품ID</code></td><td>필수</td><td>상품 구분</td></tr>
<tr><td><code>날짜</code></td><td>필수</td><td>시계열</td></tr>
<tr><td><code>최저가</code></td><td>필수</td><td>모든 신호의 재료</td></tr>
<tr><td><code>판매처 수</code></td><td>선택</td><td>기준선 신뢰(<code>trusted_base</code>) 검증 — 없으면 “항상 충분”으로 가정</td></tr>
</table>
<p>90일이면 판정과 BUY 빈도는 충분히 확인되고, “판정 후 실제로 더 내렸나”까지 채점하려면 이력이 길수록 좋다.</p>
<p><b>산출물</b> — 상품별 판정(BUY/OK/WAIT/HOLD)과 근거 수치 · <b>BUY 비중</b> 분포 · 가능한 범위의 백테스트 채점(BUY 뒤 추가 하락 여부 등) · 이를 바탕으로 한 <code>P_buy·floor</code> 권장값. <b>CSV(<code>상품ID, 날짜, 최저가</code>)만 주면 이 결과를 뽑는다.</b></p>
<h3 class=&amp;quot;stage&amp;quot; id=&amp;quot;a-pilot&amp;quot;><span class=&amp;quot;step&amp;quot;>1</span>파일럿 — 고정 N개 + 가격 변동 즉시 재계산</h3>
<div class=&amp;quot;callout&amp;quot;><b>“하루 1회”로는 부족하다.</b> 우리는 가격이 수시로 바뀌어, 낮에 최저가가 바뀌어도 판정이 어제 값이면 <b>사용자가 보는 현재가와 판정이 어긋난다</b>(현재가는 실시간, 판정만 낡음). 그래서 파일럿부터 가격 변동 재계산을 넣는다.</div>
<ul>
<li><b>대상</b>: 인기순 상위 <b>N개 고정 목록</b> + <b>수동 강제지정</b>(force-include). 프로모션으로 갑자기 밀기로 한 상품은 인기 N위 밖이어도 목록에 추가.</li>
<li><b>시점</b>: 가격 수집 파이프라인이 뿌리는 <b>“최저가 변동” 이벤트가 뜨면 그 상품만 즉시 재계산</b>. 대상이 N개로 고정이라 이벤트 기반이어도 부하가 관리된다. 가격이 안 바뀌어도 관측 창이 하루씩 밀리므로 <b>야간 1회 배치로 보정</b>한다.</li>
<li><b>캐시</b>: 최신 판정값을 저장해 같은 상품 재조회 시 재계산하지 않는다(무효화는 위 변동 이벤트가 담당). 유효기간·티어 같은 규칙은 다음 단계로.</li>
<li><b>주의</b>: 수동 지정은 <b>대상 자격</b>만 준다. 데이터가 <code>W_min</code> 미만이면 대상이어도 결과는 <code>HOLD</code>.</li>
</ul>
<h3 class=&amp;quot;stage&amp;quot; id=&amp;quot;a-next&amp;quot;><span class=&amp;quot;step&amp;quot;>2</span>다음 단계 — 동적 확장</h3>
<table>
<tr><th></th><th>파일럿(지금)</th><th>다음 단계</th></tr>
<tr><td>대상</td><td>인기 상위 N개 + 수동</td><td>+ 전환·가격대(점수 or 버킷), lazy 확대</td></tr>
<tr><td>시점</td><td>가격 변동 이벤트 즉시 + 야간 창 보정</td><td>+ 선별 확대에 맞춘 티어별 빈도</td></tr>
<tr><td>캐시</td><td>최신 판정값 저장(재조회 재계산 방지)</td><td>+ 유효기간(예 24h) · 티어</td></tr>
</table>
<p>선별 정교화 방식은 아직 확정 아님 — 임계값 한 줄(A) / 관문 두 개(B) / 점수 합산(C) / 버킷(D)을 후보로 두고, lazy를 바닥에 깔면 “미리 계산 목록”의 정교함이 덜 중요해지므로 단순하게 시작해 로그를 보고 승급한다.</p>

<h2>11. 결정이 필요한 항목</h2>
<ul>
<li>안정화 가드 기준(초기 며칠/최소 판매처)·<a class=&amp;quot;xref&amp;quot; href=&amp;quot;#a-tb&amp;quot;><code>baseline_trusted</code> 조건</a>(30일·3곳·cv 0.15 적정?).</li>
<li><a class=&amp;quot;xref&amp;quot; href=&amp;quot;#s5&amp;quot;><code>W_min</code>·<code>floor</code> 자동 산출 공식</a> 확정.</li>
<li><a class=&amp;quot;xref&amp;quot; href=&amp;quot;#a-pbuy&amp;quot;><code>P_buy</code> 초기 시드값</a>(하위 25~35%, 적극적 스탠스) + <code>eps</code>·급등 σ배수.</li>
<li><a class=&amp;quot;xref&amp;quot; href=&amp;quot;#a-pilot&amp;quot;>파일럿 <b>N</b> 값</a> · <a class=&amp;quot;xref&amp;quot; href=&amp;quot;#a-next&amp;quot;>선별 정교화 방식(A~D)</a> 선택 시점.</li>
<li><a class=&amp;quot;xref&amp;quot; href=&amp;quot;#a-next&amp;quot;>캐시 유효기간</a>(전역 vs 카테고리별) · <a class=&amp;quot;xref&amp;quot; href=&amp;quot;#a-ops&amp;quot;>드리프트 임계(±25%)</a>.</li>
<li><a class=&amp;quot;xref&amp;quot; href=&amp;quot;#s7&amp;quot;>HOLD에서 그래프만 노출/판정만 숨김 · 게이지와 판정 카드 표시</a> 관계.</li>
<li><a class=&amp;quot;xref&amp;quot; href=&amp;quot;#a-type&amp;quot;>계절형 “동월 대비”</a>를 1차 범위에 포함할지.</li>
</ul>

/* 판정 계산 */
function judge(d){
  const P=d.prices, N=P.length, cur=P[N-1];
  const allLow=Math.min(...P), allHigh=Math.max(...P);
  if(d.fresh){ return {cur,allLow,allHigh,base:cur,dBase:0,pct:50,r7:0,cv:0,slope:0,rising:false,spike:false,flat:true,nearLow:false,tier:'hold',N}; }
  const base=Math.round((d.seasonal?d.seasonRef:median(P))/100)*100;
  const dBase=(base-cur)/base*100;
  const win=P.slice(-Math.min(13,N)), below=win.filter(p=>p<cur).length;
  const pct=Math.max(6,Math.min(96,Math.round(below/win.length*100)));
  const r7=(cur-P[N-2])/P[N-2]*100;
  const sd=Math.sqrt(mean(P.map(x=>(x-mean(P))**2))), cv=sd/mean(P);
  const slope=(cur-P[Math.max(0,N-5)])/P[Math.max(0,N-5)]*100;
  const rising=slope>1.2, spike=r7>=Math.max(3,cv*100*0.6), flat=Math.abs(slope)<=1.2;
  const nearLow=cur<=Math.min(...P.slice(-4),allLow)*1.02;
  let tier;
  if(!d.seasonal&amp;amp;&amp;amp;spike) tier='wait_spike';
  else if(d.seasonal&amp;amp;&amp;amp;cur>base*1.03) tier='wait_season';
  else if(!d.seasonal&amp;amp;&amp;amp;rising) tier='wait_rise';
  else if((dBase>=4||nearLow)&amp;amp;&amp;amp;!rising) tier='good';
  else if(cur>base*1.03) tier='wait_pricey';
  else tier='ok';
  return {cur,allLow,allHigh,base,dBase,pct,r7,cv,slope,rising,spike,flat,nearLow,tier,N};
}
const VERDICT={

 wait_spike:{cls:'wait',emoji:'⏳',title:'조금 더 기다려봐요',vk:'wait'},
 wait_rise:{cls:'wait',emoji:'⏳',title:'조금 더 기다려봐요',vk:'wait'},

    case 'wait_spike': return `최근 7일 새 ${J.r7.toFixed(1)}% 올랐어요. 단기 급등 구간이라 조금 지켜보는 걸 권해요.`;
    case 'wait_rise': return `최근 가격이 오르는 중이에요. 흐름이 꺾일 때까지 지켜보는 걸 권해요.`;
    case 'wait_season': return `지금은 성수기라 작년 같은 달보다 비싼 편이에요. 비수기에 더 내려갈 수 있어요.`;
    case 'wait_pricey': return `평소보다 다소 비싼 편이에요. 조금 더 지켜보는 걸 권해요.`;
    case 'hold': return `등록된 지 얼마 안 돼 가격 데이터가 충분하지 않아요. 조금 더 쌓이면 판정해 드릴게요.`;
    default: return `평소와 큰 차이가 없어요. 지금 사도 무난한 수준이에요.`;
  }
}

  const arr=d.prices.slice(-cnt);
  const base=new Date(d.start[0],d.start[1],d.start[2]);
  return arr.map((p2,i)=>{const realIdx=N-cnt+i;const dt=new Date(base);
    if(d.monthly)dt.setMonth(dt.getMonth()+realIdx);else dt.setDate(dt.getDate()+realIdx*7);
    return{p:p2,date:dt};});
}

function renderChart(){

  const refLine = d.seasonal?d.seasonRef:J.base;
  let lo=Math.min(...pr,refLine),hi=Math.max(...pr,refLine);const pad=(hi-lo)*0.16||10000;lo-=pad;hi+=pad;

    `<line id=&amp;quot;hoverLine&amp;quot; x1=&amp;quot;0&amp;quot; y1=&amp;quot;${PADT}&amp;quot; x2=&amp;quot;0&amp;quot; y2=&amp;quot;${VBH-PADB}&amp;quot; stroke=&amp;quot;#3B7DED&amp;quot; stroke-width=&amp;quot;1&amp;quot; opacity=&amp;quot;0&amp;quot;/>`;
  const fmtY=n=>{const m=n/10000;return m>=100?(m/100).toFixed(2).replace(/\.?0+$/,'')+'백만':Math.round(m)+'만';};

}
function moveTip(clientX){const r=$('chartSvg').getBoundingClientRect(),rel=(clientX-r.left)/r.width,data=SC.data;if(!data)return;

  else{ $('fPolicy').classList.add('hidden'); $('fProto').classList.remove('hidden'); autoHeight($('fProto')); }
}
