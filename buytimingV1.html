<div class=&quot;wrap&quot;>

    <h1>구매 타이밍 판정 — 한눈에</h1>
    <div class=&quot;tagline&quot;>정책서를 다 읽지 않아도 이 페이지만으로 골자·맥락·흐름·구조가 잡히도록 요약했어요.</div>

    <div class=&quot;lead&quot;><b>한 줄 골자.</b> 가격 추이 그래프 위에, <b>“지금 살 만한 가격인지”를 4단계로 판정</b>해 얹어주는 기능. 가격 데이터만으로 판단하고, <b>미래는 예측하지 않으며</b>, 최종 결정은 사용자 몫(참고 정보)이다.</div>

    <h2>왜 필요한가 (맥락)</h2>
    <p>그래프는 <b>흐름(선)</b>을 보여줄 뿐, “그래서 지금이 살 만한 때인가”라는 <b>결론</b>은 내주지 않는다. 이 기능은 그래프가 못 하는 세 가지를 한다.</p>
    <div class=&quot;principles&quot;>
      <div class=&quot;pr&quot;><b>신호를 종합해 결론.</b> ‘평소보다 쌈 + 하락 멈춤 + 급등 아님’을 한꺼번에 따져 BUY/기다려로 결론낸다. (싸 보여도 계속 내려가는 중이면 오히려 기다릴 때 — 사람이 놓치기 쉬운 부분)</div>
      <div class=&quot;pr&quot;><b>기준이 정교하다.</b> 눈대중이 아니라 그 상품 분포에서 <b>하위 몇 %</b>인지로 잰다(“대충 아래쪽”이 아니라 “하위 6%”).</div>
      <div class=&quot;pr&quot;><b>수고를 덜어준다.</b> 매번 그래프를 해석하는 대신 한 줄 결론으로 즉시 알려주고, 목표가 알림까지 연결한다.</div>
    </div>

    <h2>4단계 판정</h2>
    <div class=&quot;states&quot;>
      <div class=&quot;st good&quot;><span class=&quot;b&quot;>BUY</span><span class=&quot;lb&quot;>지금 가격이 좋은 편이에요</span><span class=&quot;ds&quot;>평소보다 저렴·저점, 하락 멈춤</span></div>
      <div class=&quot;st ok&quot;><span class=&quot;b&quot;>OK</span><span class=&quot;lb&quot;>적정 가격이에요</span><span class=&quot;ds&quot;>평소 수준</span></div>
      <div class=&quot;st wait&quot;><span class=&quot;b&quot;>WAIT</span><span class=&quot;lb&quot;>조금 더 기다려봐요</span><span class=&quot;ds&quot;>급등·오르는 중·비쌈</span></div>
      <div class=&quot;st hold&quot;><span class=&quot;b&quot;>HOLD</span><span class=&quot;lb&quot;>아직 판단 보류</span><span class=&quot;ds&quot;>데이터 부족(경고 아님)</span></div>
    </div>

    <h2>어떻게 판정하나 (흐름)</h2>
    <p>“평소 가격”(최근 창의 <b>중앙값</b>)을 구하고 → 지금이 얼마나 싼지·몇 번째로 싼지·오르는 중인지를 잰 뒤 → <b>위에서부터 먼저 걸리는 것</b>이 판정이 된다.</p>
    <ul class=&quot;flow&quot;>
      <li>데이터가 최소 기간 미만 → <b>보류(HOLD)</b></li>
      <li>최근 급등 / 오르는 중 → <b>기다려요(WAIT)</b></li>
      <li>평소보다 싸고 · 하위권이고 · 안 오름 → <b>좋은 편(BUY)</b></li>
      <li>평소보다 비쌈 → <b>기다려요(WAIT)</b></li>
      <li>그 외 → <b>적정(OK)</b></li>
    </ul>

    <h2>핵심 원칙</h2>
    <div class=&quot;principles&quot;>
      <div class=&quot;pr&quot;><b>상대 기준.</b> 고정 %가 아니라 그 상품 자신의 가격 분포(평소 대비 위치)로 판단.</div>
      <div class=&quot;pr&quot;><b>예측 안 함.</b> 과거·현재 데이터만 사용, 미래 가격은 추정하지 않음.</div>
      <div class=&quot;pr&quot;><b>단정 안 함.</b> 방어할 수 없으면 라벨로 단정하지 않고 HOLD.</div>
      <div class=&quot;pr&quot;><b>BUY는 적극적으로.</b> 폭넓게 띄우되 <b>오르는 중일 때만</b> 차단(급등 추격 방지).</div>
      <div class=&quot;pr&quot;><b>설명은 템플릿.</b> 문구는 매번 AI 생성이 아니라 판정 사유별 규칙 템플릿.</div>
    </div>

    <h2>단계적 도입 계획</h2>
    <p>서비스에 바로 붙이지 않고, 검증부터 단계적으로 확장한다.</p>
    <div class=&quot;pipe&quot;>
      <div class=&quot;pstep&quot;><div class=&quot;n&quot;>STEP 0</div><div class=&quot;t&quot;>시뮬레이션</div><div class=&quot;d&quot;>노트북 카테고리 90일 데이터로 판정·분포 검증</div></div>
      <div class=&quot;pstep&quot;><div class=&quot;n&quot;>STEP 1</div><div class=&quot;t&quot;>파일럿</div><div class=&quot;d&quot;>전체 카테고리의 대표 상품 N개 적용 및 가격변동 즉시 재계산</div></div>
      <div class=&quot;pstep&quot;><div class=&quot;n&quot;>STEP 2</div><div class=&quot;t&quot;>확장</div><div class=&quot;d&quot;>선별·티어·캐시 구체화하여 대량 처리</div></div>
    </div>
  </div>

  <div class=&quot;panel-col&quot;>
    <div class=&quot;panel-cap&quot;>▼ 실제 화면 예시 — BUY 상태 (PDP 우측 패널)</div>
    <div class=&quot;side-inner&quot;>
      <div class=&quot;side-head&quot;>

          <div class=&quot;v-reason&quot;>출시 이후 꾸준히 내려왔고, 현재가 역대 최저 수준이에요. 최근 하락도 멈췄어요.</div>

        </div>

<body>

<div class=&quot;lead&quot;><b>한 줄 원칙</b> — 임계값을 고정 %로 박지 않고 <b>상품 자신의 가격 분포(백분위·변동성·추세)로 정규화</b>한다. 카테고리는 소수 파라미터만 얹고 그마저 <b>데이터에서 자동 산출</b>한다. <b>방어할 수 없는 판단은 라벨로 단정하지 않는다.</b></div>

<h2>1. 판정 스케일</h2>
<p>최종 출력은 네 가지 상태 중 하나. <code>HOLD</code>는 “나쁜 가격” 경고가 아니라 스케일 밖의 판단 보류다.</p>
<table>
<tr><th>상태</th><th>라벨(UI)</th><th>reason 노출</th><th>의미</th></tr>
<tr><td><code>BUY</code></td><td>✅ 지금 가격이 좋은 편이에요</td><td>—</td><td>저점 구간</td></tr>
<tr><td><code>OK</code></td><td>👍 적정 가격이에요</td><td>—</td><td>평균 수준</td></tr>
<tr><td><code>WAIT</code></td><td>⏳ 조금 더 기다려봐요</td><td><b>조건부</b> (급등·오르는 중·비쌈)</td><td>지금은 사기 이른 편</td></tr>
<tr><td><code>HOLD</code></td><td>🕒 아직 판단 보류</td><td>데이터 부족</td><td>스케일 밖(경고 아님)</td></tr>
</table>

<h2 id=&quot;s2&quot;>2. 전체 흐름 (준비 → 판정 → 출력)</h2>
<p>로직은 두 단계로 나뉜다 — <b>준비 단계</b>(카테고리마다, 월 1회 배치)에서 파라미터를 만들어 저장해두고, <b>판정 단계</b>(상품마다)에서 그 값을 읽어 판정한다.</p>

<h3>준비 단계 — <a class=&quot;xref&quot; href=&quot;#s5&quot;>카테고리 파라미터</a>를 만들어 저장</h3>

<p>준비 단계가 카테고리 테이블에 파라미터를 저장하면, 아래 판정 단계는 그 값을 <b>읽기만</b> 한다. 그래서 측정·분류를 매 판정마다 다시 하지 않는다.</p>

<h2 id=&quot;s3&quot;>3. 판정 의사코드 <span class=&quot;tag&quot;>위 판정 단계 흐름도를 그대로 코드로</span></h2>
<p>아래 코드의 분기 순서가 <a class=&quot;xref&quot; href=&quot;#s2&quot;>§2 판정 흐름도</a>와 1:1로 대응한다. 기호 정의는 <a class=&quot;xref&quot; href=&quot;#s4&quot;>§4</a>, 파라미터(<code>W·floor·P_buy</code>)는 <a class=&quot;xref&quot; href=&quot;#s5&quot;>§5</a> 참고.</p>

<h3>먼저, 말로 풀면</h3>
<p>이 상품의 <b>‘평소 가격’</b>부터 구한다 — 최근 관측 창(예: 90일)의 최저가를 크기순으로 줄 세운 <b>가운데 값(중앙값)</b>이다. 그리고 세 가지를 잰다: 지금 가격이 평소보다 <b>얼마나 싼지</b>, 최근 그 기간 중 <b>몇 번째로 싼지</b>(백분위), 요즘 <b>오르는 중인지</b>(기울기).</p>
<p>그다음 <b>위에서부터 차례로</b> 따져 먼저 걸리는 것이 판정이 된다:</p>
<ol>
<li>데이터가 유형별 최소 기간(<code>W_min</code>)도 안 쌓였으면 → <b>아직 판단 보류</b></li>
<li>최근 7일 새 급등했으면 → <b>조금 더 기다려봐요</b> (오른 값 추격 방지)</li>
<li>지금 오르는 중이면 → <b>조금 더 기다려봐요</b></li>
<li>평소보다 유의미하게 싸고 · 하위권(<code>P_buy</code> 이내)이고 · 안 오르면 → <b>지금 가격이 좋은 편이에요</b></li>
<li>(믿을 만한 기준선에서) 평소보다 비싸면 → <b>조금 더 기다려봐요</b></li>
<li>그 외 → <b>적정 가격이에요</b></li>
</ol>
<p>핵심은 <b>‘평소보다’</b>다. 고정된 몇 % 할인이 아니라 그 상품 자신의 가격 분포에서 지금이 어느 위치인지를 본다. 그래서 그래프만 봐선 애매한 “이 낮음이 의미 있는 낮음인지”를 대신 짚어준다.</p>

<h3>코드로는</h3>
<pre><code>judge(product):
    type = profile(product)               # 카테고리 테이블에서 읽음 (없으면 전역 기본값)
    win  = prices(product, last=type.W)
    cur  = win.last

    # ① 데이터 충분성 → 보류(스케일 밖)
    if dataAge(product) &amp;lt; type.W_min:
        return HOLD(&quot;아직 판단 보류&quot;)

    # 신호 (정의는 §4)
    base  = median(trusted(win))           # 평균 아닌 중앙값 + 안정화 가드
    tb    = baseline_trusted(product, win)
    gap   = base - cur
    cheap = gap &amp;gt;= floor(type, win)        # 유의미 절약(노이즈 차단)
    rising= slope(win, 30d) &amp;gt; +eps

    # ② 사실 판정 먼저 (기준선 신뢰 불필요)
    if r7(win) &amp;gt;= max(type.spikeFloor, 2*sigma_weekly(win)):
        return WAIT(&quot;최근 급등&quot;)           # 7일 변화율 기준
    if rising:
        return WAIT(&quot;오르는 중&quot;)

    # ③ 구매: '저렴' 필수, '최저 근접'은 메시지 부스터일 뿐
    if cheap and pct(cur,win) &amp;lt;= type.P_buy and not rising:
        v = BUY(&quot;지금 가격이 좋은 편이에요&quot;)
        if near_low(cur) and abs(slope) &amp;lt;= eps:
            v.booster = &quot;최근 최저가 부근에서 하락이 멈췄어요&quot;
        return v

    # ④ '비쌈'은 기준선이 믿을 만할 때만 단정
    if tb and cur &amp;gt; base and not cheap:
        return WAIT(&quot;평소보다 비쌈&quot;)

    return OK(&quot;적정 가격이에요&quot;)            # 그 외 (라벨 과claim 안 함)</code></pre>

<h2 id=&quot;s4&quot;>4. 상품별 자동 계산 신호</h2>
<p>모든 신호의 재료는 <b>상품마다 “그날의 최저가”를 날짜순으로 쌓은 한 줄</b>(가격추이 그래프용 데이터)이다. 아래 기호는 전부 이 한 줄에서 나온다.</p>
<dl>
<dt><code>W</code> — 관측 창 길이</dt>
<dd>며칠 치를 비교 대상으로 볼지. <a class=&quot;xref&quot; href=&quot;#s5&quot;>카테고리 파라미터(§5)</a>다. <code>win</code>은 “오늘부터 거꾸로 <code>W</code>일치 최저가”. 노트북은 <code>W=90</code>, 계절상품은 <code>365</code>처럼 길어진다.</dd>

<dt><code>cur</code> — 현재 최저가</dt>
<dd>그 줄의 <b>가장 최근 값</b>(= <code>win</code>의 마지막 원소). 새로 어디서 가져오는 게 아니라, PDP에 크게 뜨는 그 “현재 최저가” 그대로다.</dd>

<dt><code>base</code> — 기준선(중앙값)</dt>
<dd><code>win</code> 값을 크기순으로 줄 세웠을 때 <b>가운데 값</b>. <b>평균이 아니라 중앙값을 쓰는 이유</b>는, 평균은 극단값(출시 초기 비정상 저가나 일시 급등 며칠)에 끌려가지만 중앙값은 안 끌려 “이 상품의 평소 가격”을 더 정직하게 대표하기 때문이다. <b>계산</b>: 신뢰 구간만 골라(아래 안정화 가드) 정렬 → 가운데 값(짝수 개면 가운데 둘의 평균).</dd>

<dt><code>gap</code> = <code>base − cur</code></dt>
<dd>양수면 평소(중앙값)보다 그만큼 싸다는 뜻.</dd>

<dt id=&quot;a-tb&quot;><code>trusted_base</code> — 기준선 신뢰 여부 (참/거짓)</dt>
<dd>숫자가 아닌 플래그. 아래 3조건을 모두 통과해야 <code>true</code>이고, 그래야만 ‘평소보다 비쌈’을 단정한다. <b>HOLD와는 다른 층위</b> — HOLD는 “판정 자체 불가”, <code>false</code>는 “판정은 하되 *비쌈이라고 단정만* 보류(→ OK로)”.
<table style=&quot;margin-top:6px&quot;>
<tr><th>조건</th><th>의미</th><th>초기값(제안)</th></tr>
<tr><td>안정화 경과</td><td>DB 진입 후 충분히 지났나</td><td>데이터 ≥ 30일 + 출시 직후 7~14일 제외</td></tr>
<tr><td>판매처 충분</td><td>시장가를 대표하나</td><td>평균 판매처 수 ≥ 3곳</td></tr>
<tr><td>변동성 적정</td><td>너무 출렁여 ‘평소’가 무의미하진 않나</td><td>변동계수 cv ≤ 0.15</td></tr>
</table></dd>

<dt><code>slope</code> — 추세</dt>
<dd>최근 30일 회귀 기울기. 상승 / 안정 / 하락을 가른다.</dd>

<dt><code>pct</code> — 백분위</dt>
<dd><code>win</code> 안에서 현재가의 위치(0 = 최저). 가격대와 무관해 카테고리 간 비교가 가능하다.</dd>

<dt><code>r7</code> — 최근 7일 <b>변화율</b></dt>
<dd>이전 표의 “수익률”은 금융 용어를 잘못 빌린 것으로, 정확히는 <b>가격 변화율</b>이다. <code>r7 = (오늘 최저가 − 7일 전 최저가) / 7일 전 최저가</code>. 예: 7일 전 200만 → 오늘 220만이면 <code>+10%</code>. 양수로 크면(급등) <code>WAIT·급등</code>에 쓰인다.</dd>
</dl>
<h3>이 파라미터들이 의사코드에서 쓰이는 위치</h3>
<p><code>W_min</code>·<code>P_buy</code>는 신호를 <b>계산</b>하는 값이 아니라, 만든 신호를 <b>어디서 자를지</b> 정하는 값이라 위 정의 목록엔 없었다. 실제로는 <a class=&quot;xref&quot; href=&quot;#s3&quot;>§3 의사코드</a>의 분기 조건에 들어간다.</p>
<table>
<tr><th>기호</th><th>종류</th><th>§3 의사코드에서 쓰이는 분기</th></tr>
<tr><td><code>W</code></td><td>카테고리 파라미터</td><td><code>prices(last=W)</code> — 신호 계산의 입력(창 길이)</td></tr>
<tr><td><code>W_min</code></td><td>카테고리 파라미터</td><td>① 첫 게이트 <code>if dataAge &amp;lt; W_min → HOLD</code> — 판정을 시작할지 여부</td></tr>
<tr><td><code>P_buy</code></td><td>카테고리 파라미터</td><td>③ 구매 분기 <code>if pct ≤ P_buy → BUY</code> — 백분위를 끊는 구매 기준선</td></tr>
</table>

<h2 id=&quot;s5&quot;>5. 카테고리 파라미터 — “정하는” 게 아니라 “재서 나오는”</h2>
<p><a class=&quot;xref&quot; href=&quot;#s2&quot;>§2 준비 단계</a>의 ①~④가 이 절의 내용이다. <b>측정이 먼저고, 유형은 측정의 결과이며, 파라미터는 유형이 정해진 다음 채워진다.</b> 따라서 아래 유형 프로파일 표는 입력이 아니라 <b>분류 후 적용할 규칙(출력 템플릿)</b>이다.</p>

<h3>준비 단계 (카테고리마다, 월 1회)</h3>
<pre><code>① 카테고리 표본을 측정       → cv·계절성·추세·표본길이
② 측정값으로 유형 분류        → &quot;이건 감가형&quot;
③ 유형이 정해지면 파라미터 채움
       W, W_min : 유형이 정함 (감가형이면 W=90)
       floor    : ①에서 잰 변동성으로 계산
       P_buy    : 전역 1값 (유형 무관)
④ 카테고리 테이블에 [유형 + W·W_min·floor·P_buy] 저장</code></pre>
<p><b>판정 단계(상품마다)</b>는 위에서 저장한 값을 <b>읽기만</b> 한다. 그래서 측정·분류가 매 판정마다 돌지 않아 순환이 생기지 않는다.</p>

<h3 id=&quot;a-pbuy&quot;>P_buy — 우리가 판단할 한 가지: “얼마나 자주 사라고 권할까”</h3>
<p><code>P_buy</code>(하위 몇 %에서 BUY를 띄울지)는 데이터가 답을 주지 않는 <b>사업 판단</b>이다. 추천 빈도와 정확도의 맞교환이기 때문.</p>
<ul>
<li><b>느슨하게(하위 30%)</b> → BUY가 자주 뜸. 자주 보이지만 “샀더니 더 싸지던데?” 불만 위험↑.</li>
<li><b>깐깐하게(하위 10%)</b> → 가끔 뜨지만 거의 진짜 저점. 대신 도구가 소극적으로 느껴짐.</li>
</ul>
<p>결정할 질문: <b>“BUY를 전체 판정의 몇 %쯤 띄울까, 한 번 틀렸을 때의 신뢰 타격을 얼마나 감수할까.”</b> <b>기본 스탠스는 적극적으로</b> — 하위 25~35%에서 시작해 BUY가 자주 나오게 넓게 잡고, 신뢰는 백테스트 적중률로 관리한다.</p>

<h3 id=&quot;a-ops&quot;>파라미터 산출 운영 — 표본·주기·비용 <span class=&quot;tag new&quot;>유지</span></h3>
<p><b>표본은 카테고리에 상품이 몇 개(N)든 무관.</b> 재는 건 통계적 성격이라 정밀도는 표본 수에만 달려 있고 모집단 N과 독립이다(5천 개든 5만 개든 잘 뽑은 수백 개면 같은 값).</p>
<table>
<tr><th>상황</th><th>표본</th></tr>
<tr><td>기본</td><td>활성·대표 상품 <b>약 500개</b> (가격대 층화, 단종·신상품 제외)</td></tr>
<tr><td>적격 ~500개 미만 소규모 카테고리</td><td>전수 (적어서 쌈)</td></tr>
<tr><td>내부 이질 대형(30만 사무용~500만 게이밍)</td><td>표본 ↑ 금지 → <b>하위 카테고리로 분리</b></td></tr>
</table>
<table>
<tr><th>대상</th><th>주기</th><th>이유</th></tr>
<tr><td>감가형·안정형·계절형</td><td>월 1회</td><td>통계 성격이 느리게 변함</td></tr>
<tr><td>시세/스파이크형(GPU·메모리·금)</td><td>주 1회</td><td>σ·floor가 급등 판정에 직접 쓰여 신선도 필요</td></tr>
<tr><td>계절성·유형 분류</td><td>분기 1회</td><td>1년 창 필요, 한번 정해지면 정적</td></tr>
<tr><td>전 유형 공통</td><td>드리프트 트리거</td><td>변동성이 저장값과 ±25% 이상 어긋나면 주기 무관 즉시 재계산</td></tr>
</table>
<blockquote>비용 감: <b>카테고리 ~3천 × 표본 500개 × 월 1회 ≈ 월 150만 건 읽기</b>. 그마저 원시 수집이 아니라 그래프용으로 이미 만든 일자별 최저가 집계 위에서 요약 → 야간 소형 배치 수준. <b>처음엔 전역 기본값 1개로 시작(측정 잡 자체 없음)</b>하고, 기본값이 안 맞는 상위 카테고리만 측정을 켠다.</blockquote>

<h3 id=&quot;a-type&quot;>유형 프로파일 (출력 템플릿)</h3>
<table>

<div class=&quot;callout&quot;><b>유형이 바뀌면 파라미터 세트가 통째로 갈린다.</b> 예를 들어 계절형(관측 창 12~24개월, ‘작년 동월’ 대비)에서 감가형(창 90일, ‘최근 90일 중앙값’ 대비)으로 재분류되면 <code>W·W_min</code>부터 비교 기준까지 바뀐다. 그래서 유형 전환은 <b>분기 재분류에서 1년 치 데이터로, 가급적 사람 확인을 거쳐 드물게</b> 일어나며, 전환 직후엔 새 창이 <code>W_min</code>만큼 다시 찰 때까지 그 카테고리를 잠깐 <code>HOLD</code>로 두어 낡은 기준의 오판을 막는다.</div>

<h2>6. 구매(BUY) 신호 설계 — 적극적으로, 단 과트리거는 방지</h2>
<p><b>스탠스: BUY를 폭넓게 띄운다.</b> 다만 제약 없이 “평균보다 싸거나 <b>또는</b> 최저가에 근접” 둘 중 하나로 띄우면, 가격이 계속 내려가는 상품(노트북 등)은 매일 신저가를 깨 “최저가 근접”이 거의 매일 참 → 매일 ‘살 만한 가격’이 떠 신뢰가 무너진다. 그래서 <b>딱 하나의 가드</b>만 둔다.</p>
<p>BUY = <code>저렴(평균↓)</code> 그리고 <code>하위 P_buy</code> 그리고 <code>상승 아님</code>. 여기서 <code>상승 아님</code>은 <b>가격이 오르는 중일 때만</b> BUY를 막는다는 뜻이다(📉 내려가는 중·➡️ 평탄은 모두 허용, 📈 오르는 중만 차단). 오른 가격을 뒤늦게 사게 되는 것만 피하는, 느슨한 조건이라 싼 구간에선 BUY가 자주 뜬다. “최저가 근접”은 트리거가 아니라 메시지를 강화하는 보조 신호로만 쓴다.</p>
<div class=&quot;callout&quot;><b>BUY를 더 자주 띄우기 — 레버와 파급.</b> <b>① P_buy 상향(주 레버)</b>: 하위 %를 넓히면 BUY 빈도↑. 파급은 백테스트 적중률 재보정뿐이라 가장 안전. <b>② ‘상승 아님’ 완화</b>: 이미 느슨하나 더 풀면 감가형이 매일 뜨는 문제 재발 → <b>감가형만 유지</b>. <b>③ floor(유의미 절약) 하향</b>: ‘별로 안 싼데 뜸’ 위험 → <b>유지</b>. 결론: 넓히는 건 ①로, ②·③은 그대로 둔다.</div>
<table>
<tr><th>상황</th><th>제약 없음</th><th>현재 설계</th></tr>
<tr><td>매일 하락 중인 상품</td><td>매일 뜸</td><td>싼 구간이면 자주 뜨되, <b>오르는 중일 때만 차단</b></td></tr>
<tr><td>최저 근접이나 평균보단 비쌈</td><td>뜸(오판)</td><td><code>저렴</code> 미충족 → 적정</td></tr>
</table>

<h2 id=&quot;s7&quot;>7. 상태별 화면 표기 규칙 (배지·라벨·이유·게이지)</h2>
<p>판정 결과를 UI에서 어떻게 보여줄지의 매핑이다.</p>
<table>
<tr><th>상태</th><th>배지·색</th><th>라벨</th><th>reason</th><th>저렴↔비쌈 게이지</th></tr>
<tr><td><code>BUY</code></td><td>✅ 초록</td><td>지금 가격이 좋은 편이에요</td><td>— (+최저근접 부스터)</td><td>노출</td></tr>
<tr><td><code>OK</code></td><td>👍 회색</td><td>적정 가격이에요</td><td>—</td><td>노출</td></tr>
<tr><td><code>WAIT</code></td><td>⏳ 주황</td><td>조금 더 기다려봐요</td><td>급등·오르는 중·(비쌈 조건부)</td><td>노출</td></tr>
<tr><td><code>HOLD</code></td><td>🕒 중립</td><td>아직 판단 보류</td><td>데이터 부족</td><td>숨김</td></tr>
</table>
<h3>판정 설명 문구는 규칙 기반 템플릿으로 생성</h3>
<p>배지 아래 1~2줄 설명은 <b>매번 AI가 생성하지 않고, 판정 유형별 템플릿</b>에 수치를 끼워 만든다. 매 가격 변동마다 LLM을 태우면 “판정은 가벼운 산수”라는 <a class=&quot;xref&quot; href=&quot;#s8&quot;>§8</a> 전제가 깨지고, 오래 다듬은 워딩 통제(“사라” 회피 등)를 벗어날 위험이 있어서다. “AI 분석”의 핵심 가치는 <b>판정(배지) 자체</b>이며, 설명은 그 근거를 거드는 보조다.</p>
<p><b>“모든 상황”이 아니라 “판정이 근거로 삼는 사유”만 커버하면 된다.</b> 상황 조합은 무한하지만, 우리 판정이 보는 신호는 §3 분기로 한정돼 있어 <b>사유 = 로직 분기</b>다. 그래서 분기 수만큼만 템플릿을 두면 낼 수 있는 사유는 모두 커버된다.</p>
<table>
<tr><th>판정</th><th>대표 사유(템플릿 분기)</th></tr>
<tr><td><code>BUY</code></td><td>역대 최저 근처 · 하락 멈춤 · 평소보다 내려옴</td></tr>
<tr><td><code>WAIT</code></td><td>최근 급등 · 오르는 중 · 평소보다 비쌈</td></tr>
<tr><td><code>OK</code></td><td>평소 수준</td></tr>
<tr><td><code>HOLD</code></td><td>데이터 부족</td></tr>
</table>
<p><b>구멍은 두 규칙으로 흡수한다.</b> ①여러 사유가 동시에 맞으면 <b>판정 우선순위상 가장 중요한 사유 하나만</b> 문장으로 낸다. ②어느 특수 사유에도 안 맞으면 <b>판정 유형의 기본 문장</b>으로 떨어진다(예: OK → “평소와 큰 차이가 없어요”). 따라서 “문구가 안 나오는 경우”는 없다 — 특수 문장이 아니면 기본 문장이 항상 나온다.</p>

<h2 id=&quot;s8&quot;>8. 계산 비용 — 상품 판정 실행 <span class=&quot;tag&quot;>주로 확장 단계</span></h2>
<div class=&quot;callout&quot;><b>한 문장 원칙.</b> 수만 개 상품을 매 순간 다 계산하면 서버가 못 버티니, <b>계산할 가치가 있는 것만 · 가격이 바뀔 때만</b> 계산한다.</div>
<p>판정 1건은 “가격 한 줄에서 중앙값·백분위·기울기 뽑기”라 가벼운 연산이다. 문제는 <b>대상 수 × 재계산 빈도</b>가 커질 때뿐이다.</p>
<p><b>⚠ 아래 ‘누구를·언제’ 기준은 수만 개로 확장할 때의 설계다. 파일럿에는 적용하지 않으며, 단계적 확장 시 다룬다(<a class=&quot;xref&quot; href=&quot;#s10&quot;>§10</a>).</b></p>
<ul>
<li><b>누구를 계산하나</b> — 팔릴 만한 상품만(조회·검색 많고, 알림 걸려 있고, 잘 팔리는 것 우선). 판매처 하나뿐·단종·정가 고정은 제외.</li>
<li><b>언제 다시 계산하나</b> — 판정은 가격이 바뀔 때만 달라지므로 <b>가격 변동 이벤트가 뜰 때만</b> 재계산하고, 나머지 시간엔 저장값을 보여준다.</li>
</ul>
<div class=&quot;callout&quot;><b>파일럿(≈100개)에는 위 장치가 필요 없다.</b> 100개 고정이면 가격이 바뀔 때마다 재계산해도 이미 도는 가격 수집에 가벼운 산수 한 줄을 얹는 수준이라 부담이 없다. 선별·티어·캐시는 전부 <b>확장 단계</b>의 과제다.</div>

<h2>9. 검증(백테스트)</h2>
<ul>
<li>유형별 샘플 N개 매일 판정 로그 → <code>t+30/60일</code> 실제 최저가 대조.</li>
<li>지표: BUY 적중(이후 추가 하락 없음) · WAIT 적중(이후 하락) · <b>판정 분포(BUY 비중이 목표대로인지)</b> · HOLD 해제 후 안정성.</li>
<li><code>P_buy·floor·eps·σ배수</code> 그리드서치 보정.</li>
</ul>

<h2 id=&quot;s10&quot;>10. 파일럿 &amp;amp; 단계적 확장 <span class=&quot;tag new&quot;>신규</span></h2>
<p>대상은 <b>모델 상품(가격추이가 저장되는 상품군)</b>으로 한정한다. 그 안에서도 수만 개라, 복잡한 선별·lazy·티어는 다음 단계로 미루되 <b>가격 변동 재계산만은 파일럿부터 넣어</b> 단순하게 시작한다.</p>
<h3 class=&quot;stage&quot;><span class=&quot;step&quot;>전</span>파일럿 전 — 오프라인 시뮬레이션</h3>
<p>실서비스에 붙이기 전에, 과거 가격 데이터를 받아 판정을 <b>먼저 돌려본다</b>. 판정이 상식에 맞는지, BUY가 얼마나 자주 뜨는지(적극적 스탠스의 실제 빈도)를 눈으로 확인하고 <code>P_buy·floor</code>를 실데이터로 조율하기 위함이다.</p>
<p><b>필요한 데이터</b> — 상품별 <b>일자별 최저가 한 줄</b>이면 된다. (1차 대상: <b>노트북 카테고리(감가형)</b>, 90일 이상)</p>
<table>
<tr><th>컬럼</th><th>필수?</th><th>용도</th></tr>
<tr><td><code>상품ID</code></td><td>필수</td><td>상품 구분</td></tr>
<tr><td><code>날짜</code></td><td>필수</td><td>시계열</td></tr>
<tr><td><code>최저가</code></td><td>필수</td><td>모든 신호의 재료</td></tr>
<tr><td><code>판매처 수</code></td><td>선택</td><td>기준선 신뢰(<code>trusted_base</code>) 검증 — 없으면 “항상 충분”으로 가정</td></tr>
</table>
<p>90일이면 판정과 BUY 빈도는 충분히 확인되고, “판정 후 실제로 더 내렸나”까지 채점하려면 이력이 길수록 좋다.</p>
<p><b>산출물</b> — 상품별 판정(BUY/OK/WAIT/HOLD)과 근거 수치 · <b>BUY 비중</b> 분포 · 가능한 범위의 백테스트 채점(BUY 뒤 추가 하락 여부 등) · 이를 바탕으로 한 <code>P_buy·floor</code> 권장값. <b>CSV(<code>상품ID, 날짜, 최저가</code>)만 주면 이 결과를 뽑는다.</b></p>
<h3 class=&quot;stage&quot; id=&quot;a-pilot&quot;><span class=&quot;step&quot;>1</span>파일럿 — 고정 N개 + 가격 변동 즉시 재계산</h3>
<div class=&quot;callout&quot;><b>“하루 1회”로는 부족하다.</b> 우리는 가격이 수시로 바뀌어, 낮에 최저가가 바뀌어도 판정이 어제 값이면 <b>사용자가 보는 현재가와 판정이 어긋난다</b>(현재가는 실시간, 판정만 낡음). 그래서 파일럿부터 가격 변동 재계산을 넣는다.</div>
<ul>
<li><b>대상</b>: 인기순 상위 <b>N개 고정 목록</b> + <b>수동 강제지정</b>(force-include). 프로모션으로 갑자기 밀기로 한 상품은 인기 N위 밖이어도 목록에 추가.</li>
<li><b>시점</b>: 가격 수집 파이프라인이 뿌리는 <b>“최저가 변동” 이벤트가 뜨면 그 상품만 즉시 재계산</b>. 대상이 N개로 고정이라 이벤트 기반이어도 부하가 관리된다. 가격이 안 바뀌어도 관측 창이 하루씩 밀리므로 <b>야간 1회 배치로 보정</b>한다.</li>
<li><b>캐시</b>: 최신 판정값을 저장해 같은 상품 재조회 시 재계산하지 않는다(무효화는 위 변동 이벤트가 담당). 유효기간·티어 같은 규칙은 다음 단계로.</li>
<li><b>주의</b>: 수동 지정은 <b>대상 자격</b>만 준다. 데이터가 <code>W_min</code> 미만이면 대상이어도 결과는 <code>HOLD</code>.</li>
</ul>
<h3 class=&quot;stage&quot; id=&quot;a-next&quot;><span class=&quot;step&quot;>2</span>다음 단계 — 동적 확장</h3>
<table>
<tr><th></th><th>파일럿(지금)</th><th>다음 단계</th></tr>
<tr><td>대상</td><td>인기 상위 N개 + 수동</td><td>+ 전환·가격대(점수 or 버킷), lazy 확대</td></tr>
<tr><td>시점</td><td>가격 변동 이벤트 즉시 + 야간 창 보정</td><td>+ 선별 확대에 맞춘 티어별 빈도</td></tr>
<tr><td>캐시</td><td>최신 판정값 저장(재조회 재계산 방지)</td><td>+ 유효기간(예 24h) · 티어</td></tr>
</table>
<p>선별 정교화 방식은 아직 확정 아님 — 임계값 한 줄(A) / 관문 두 개(B) / 점수 합산(C) / 버킷(D)을 후보로 두고, lazy를 바닥에 깔면 “미리 계산 목록”의 정교함이 덜 중요해지므로 단순하게 시작해 로그를 보고 승급한다.</p>

<h2>11. 결정이 필요한 항목</h2>
<ul>
<li>안정화 가드 기준(초기 며칠/최소 판매처)·<a class=&quot;xref&quot; href=&quot;#a-tb&quot;><code>baseline_trusted</code> 조건</a>(30일·3곳·cv 0.15 적정?).</li>
<li><a class=&quot;xref&quot; href=&quot;#s5&quot;><code>W_min</code>·<code>floor</code> 자동 산출 공식</a> 확정.</li>
<li><a class=&quot;xref&quot; href=&quot;#a-pbuy&quot;><code>P_buy</code> 초기 시드값</a>(하위 25~35%, 적극적 스탠스) + <code>eps</code>·급등 σ배수.</li>

function judge(d){
  const P=d.prices, N=P.length, cur=P[N-1];
  const allLow=Math.min(...P), allHigh=Math.max(...P);
  if(d.fresh){ return {cur,allLow,allHigh,base:cur,dBase:0,pct:50,r7:0,cv:0,slope:0,rising:false,spike:false,flat:true,nearLow:false,tier:'hold',N}; }
  const base=Math.round((d.seasonal?d.seasonRef:median(P))/100)*100;
  const dBase=(base-cur)/base*100;
  const win=P.slice(-Math.min(13,N)), below=win.filter(p=>p<cur).length;
  const pct=Math.max(6,Math.min(96,Math.round(below/win.length*100)));
  const r7=(cur-P[N-2])/P[N-2]*100;
  const sd=Math.sqrt(mean(P.map(x=>(x-mean(P))**2))), cv=sd/mean(P);
  const slope=(cur-P[Math.max(0,N-5)])/P[Math.max(0,N-5)]*100;
  const rising=slope>1.2, spike=r7>=Math.max(3,cv*100*0.6), flat=Math.abs(slope)<=1.2;
  const nearLow=cur<=Math.min(...P.slice(-4),allLow)*1.02;
  let tier;
  if(!d.seasonal&amp;&amp;spike) tier='wait_spike';
  else if(d.seasonal&amp;&amp;cur>base*1.03) tier='wait_season';
  else if(!d.seasonal&amp;&amp;rising) tier='wait_rise';
  else if((dBase>=4||nearLow)&amp;&amp;!rising) tier='good';
  else if(cur>base*1.03) tier='wait_pricey';
  else tier='ok';
  return {cur,allLow,allHigh,base,dBase,pct,r7,cv,slope,rising,spike,flat,nearLow,tier,N};
}

  let path='';data.forEach((o,i)=>path+=(i?'L':'M')+X(i).toFixed(1)+','+Y(o.p).toFixed(1)+' ');
  const area=path+`L${X(data.length-1).toFixed(1)},${VBH-PADB} L${X(0).toFixed(1)},${VBH-PADB} Z`;
  let grid='';[0,.5,1].forEach(t=>{const y=(PADT+t*iH).toFixed(1);grid+=`<line x1=&quot;0&quot; y1=&quot;${y}&quot; x2=&quot;${VBW}&quot; y2=&quot;${y}&quot; stroke=&quot;#f2f2f6&quot;/>`;});
  const yR=Y(refLine).toFixed(1);
  const ref=`<line x1=&quot;0&quot; y1=&quot;${yR}&quot; x2=&quot;${VBW}&quot; y2=&quot;${yR}&quot; stroke=&quot;#E59AA0&quot; stroke-width=&quot;1.1&quot; stroke-dasharray=&quot;4 3&quot;/>`;
  let mk='';const minI=pr.indexOf(Math.min(...pr));
  if(Math.min(...pr)===J.allLow) mk+=`<circle cx=&quot;${X(minI)}&quot; cy=&quot;${Y(pr[minI])}&quot; r=&quot;3.6&quot; fill=&quot;#fff&quot; stroke=&quot;#E5342A&quot; stroke-width=&quot;2&quot;/>`;
  const cx=X(data.length-1),cy=Y(data[data.length-1].p);
  mk+=`<circle cx=&quot;${cx}&quot; cy=&quot;${cy}&quot; r=&quot;5.5&quot; fill=&quot;#3B7DED&quot; opacity=&quot;.16&quot;/><circle cx=&quot;${cx}&quot; cy=&quot;${cy}&quot; r=&quot;3.2&quot; fill=&quot;#3B7DED&quot;/>`;
  $('chartSvg').innerHTML=grid+`<defs><linearGradient id=&quot;g&quot; x1=&quot;0&quot; y1=&quot;0&quot; x2=&quot;0&quot; y2=&quot;1&quot;><stop offset=&quot;0%&quot; stop-color=&quot;#3B7DED&quot; stop-opacity=&quot;.16&quot;/><stop offset=&quot;100%&quot; stop-color=&quot;#3B7DED&quot; stop-opacity=&quot;.01&quot;/></linearGradient></defs>`+
    `<path d=&quot;${area}&quot; fill=&quot;url(#g)&quot;/>`+ref+`<path d=&quot;${path}&quot; fill=&quot;none&quot; stroke=&quot;#3B7DED&quot; stroke-width=&quot;2&quot; stroke-linecap=&quot;round&quot; stroke-linejoin=&quot;round&quot;/>`+mk+
    `<line id=&quot;hoverLine&quot; x1=&quot;0&quot; y1=&quot;${PADT}&quot; x2=&quot;0&quot; y2=&quot;${VBH-PADB}&quot; stroke=&quot;#3B7DED&quot; stroke-width=&quot;1&quot; opacity=&quot;0&quot;/>`;
  const fmtY=n=>{const m=n/10000;return m>=100?(m/100).toFixed(2).replace(/\.?0+$/,'')+'백만':Math.round(m)+'만';};
  $('yAxis').innerHTML=[hi,(hi+lo)/2,lo].map(v=>`<span>${fmtY(v)}</span>`).join('');
  const idx=data.length<=4?data.map((_,i)=>i):[0,Math.round((data.length-1)/2),data.length-1];
  const lab=dt=>(dt.getFullYear()+'').slice(2)+'.'+(dt.getMonth()+1);
  $('xLabels').innerHTML=idx.map(i=>{const last=i===data.length-1;return `<span${last?' style=&quot;color:#3B7DED;font-weight:700&quot;':''}>${last?'현재':lab(data[i].date)}</span>`;}).join('');
}
function moveTip(clientX){const r=$('chartSvg').getBoundingClientRect(),rel=(clientX-r.left)/r.width,data=SC.data;if(!data)return;
  let i=Math.max(0,Math.min(data.length-1,Math.round(rel*(data.length-1))));
  const xv=SC.X(i),yv=SC.Y(data[i].p),tip=$('tip');
  tip.style.left=(xv/VBW*r.width)+'px';tip.style.top=(yv/VBH*r.height-12)+'px';
  tip.innerHTML=`${fmt(data[i].p)}원<span class=&quot;d&quot;> · ${(data[i].date.getMonth()+1)}.${data[i].date.getDate()}</span>`;tip.style.opacity='1';
  const hl=$('hoverLine');if(hl){hl.setAttribute('x1',xv);hl.setAttribute('x2',xv);hl.setAttribute('opacity','.4');}}
function hideTip(){$('tip').style.opacity='0';const hl=$('hoverLine');if(hl)hl.setAttribute('opacity','0');}

/* 팝오버/알림/토스트 */
function togglePop(e){e.stopPropagation();$('critPop').classList.toggle('open');}
function closePop(){$('critPop').classList.remove('open');}
function setPreset(v){$('alertInput').value=v;}
function setAlert(){toast('🔔 '+$('alertInput').value+'원 알림이 설정됐어요');}
let tT;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),2400);}

document.addEventListener('click',e=>{if(!$('critPop').contains(e.target)&amp;&amp;!e.target.closest('.crit-link'))closePop();});
window.addEventListener('DOMContentLoaded',()=>{
  $('chartArea').addEventListener('pointermove',e=>moveTip(e.clientX));
  $('chartArea').addEventListener('pointerdown',e=>moveTip(e.clientX));
  $('chartArea').addEventListener('pointerleave',hideTip);
  render();
});
</script>
